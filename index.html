{h:"1. Semiconductor materials",b:"<ul><li>Ge (32 e⁻, tetravalent) Eg = 0.67 eV · Si (14 e⁻) Eg = 1.1 eV · GaAs Eg = 1.43 eV.</li><li>Intrinsic = ultra-pure. Extrinsic = doped.</li><li>Negative temperature coefficient: resistance falls as temperature rises, since more bonds break.</li><li>Si dominates because it is less temperature sensitive, abundant and easy to refine. GaAs is faster (higher mobility) and is used for RF and optical devices.</li></ul>"},

{h:"3. n-type and p-type",b:"<ul><li>n-type: donors (Sb, As, P) with 5 valence electrons. Majority carriers: electrons. Minority: holes.</li><li>p-type: acceptors (B, Ga, In) with 3 valence electrons. Majority carriers: holes. Minority: electrons.</li><li>Both are electrically neutral. The impurity ions balance the carrier charge.</li><li>Hole current direction = conventional current.</li></ul>"},
{h:"4. The p–n junction & bias",b:"<ul><li>Diffusion of majority carriers across the junction leaves uncovered ions, forming the depletion region and a barrier potential.</li><li>No bias: ID = 0. The diffusion current and the drift (minority) current cancel.</li><li>Forward bias: the depletion region narrows, ID rises exponentially, and the knee is reached at VK.</li><li>Reverse bias: the depletion region widens, only Is flows (minority carriers), and Is is nearly constant until breakdown.</li><li>Breakdown: Zener effect (low VZ, field-induced) or avalanche (high VZ, ionization collisions).</li></ul>"},
{h:"5. Shockley equation & temperature",b:"<div class='eq'>I<sub>D</sub> = I<sub>s</sub>(e<sup>V<sub>D</sub>/nV<sub>T</sub></sup> − 1), V<sub>T</sub> = kT/q ≈ 26 mV at room temperature</div><ul><li>n = 1 to 2 (Si discrete devices often n ≈ 2 at low current, n = 1 at higher current).</li><li>I<sub>s</sub> doubles for every 10 °C rise.</li><li>Forward voltage drops ≈ 2 mV/°C at constant current.</li><li>Knee voltages: Si 0.7 V, Ge 0.3 V, GaAs 1.2 V.</li></ul>"},
{h:"6. Resistance levels",b:"<ul><li>DC: R<sub>D</sub> = V<sub>D</sub>/I<sub>D</sub> at the Q-point. It falls as current rises.</li><li>AC (dynamic): r<sub>d</sub> = ΔV<sub>d</sub>/ΔI<sub>d</sub> = 26 mV/I<sub>D</sub> (plus a small r<sub>B</sub> bulk term).</li><li>Average AC: r<sub>av</sub> = ΔV/ΔI between two limit points, used for the piecewise-linear model.</li></ul>"},
{h:"7. Equivalent circuits",b:"<ul><li>Piecewise-linear: ideal diode + V<sub>K</sub> + r<sub>av</sub>.</li><li>Simplified: ideal diode + V<sub>K</sub> (the usual choice for hand analysis).</li><li>Ideal: short in forward bias, open in reverse.</li></ul>"},
{h:"8. Capacitance & reverse recovery",b:"<ul><li>Transition (depletion) capacitance C<sub>T</sub> dominates in reverse bias and decreases as reverse voltage increases.</li><li>Diffusion capacitance C<sub>D</sub> dominates in forward bias. It comes from stored minority carriers and grows with current.</li><li>t<sub>rr</sub> = t<sub>s</sub> (storage) + t<sub>t</sub> (transition). It limits the switching speed of rectifiers.</li></ul>"},
{h:"9. Zener diodes",b:"<ul><li>Operates in reverse breakdown, holding V<sub>Z</sub> nearly constant.</li><li>V<sub>Z</sub> is set by doping. P<sub>Zmax</sub> = V<sub>Z</sub>·I<sub>ZM</sub>.</li><li>Below ~5 V, the Zener effect gives a negative temperature coefficient. Above ~5 V, avalanche gives a positive one.</li><li>Equivalent: V<sub>Z</sub> source in series with r<sub>Z</sub> in breakdown.</li></ul>"},
{h:"10. LEDs",b:"<ul><li>Forward-biased recombination releases photons (GaAsP, GaP, GaN). Si and Ge release only heat.</li><li>V<sub>F</sub> ≈ 1.7–3+ V depending on colour, higher than Si.</li><li>Series resistor: R = (V<sub>s</sub> − V<sub>LED</sub>)/I<sub>LED</sub>. Brightness rises with I<sub>F</sub>.</li></ul>"}];

["For that circuit, IC =",["2.01 mA","0.8 mA","4 mA","20 mA"],0,"50 × 40.1 μA."],
["VCE (emitter bias) =",["VCC − IC(RC + RE)","VCC − ICRC","VCC","IC·RE"],0,"IE ≈ IC."],
["Emitter-bias saturation current:",["VCC/(RC + RE)","VCC/RC","VCC/RE","VCC/RB"],0,"Both resistors in the loop."],

{t:"Voltage-divider bias (4.5)",q:[
["Two analysis methods are:",["exact (Thevenin) and approximate","only exact","graphical only","none"],0,"Pick by βRE vs R2."],
["The approximate method is valid when:",["βRE ≥ 10R2","βRE ≤ R2","RE = 0","β = 1"],0,"The base current is negligible."],
["VB (approximate) =",["VCC·R2/(R1+R2)","VCC·R1/(R1+R2)","VCC","VBE"],0,"Unloaded divider."],
["VCC = 22 V, R1 = 39 kΩ, R2 = 3.9 kΩ: VB =",["2 V","20 V","0.7 V","11 V"],0,"22 × 3.9/42.9."],
["With VB = 2 V: VE =",["1.3 V","2.7 V","2 V","0.7 V"],0,"VB − 0.7."],
["With RE = 1.5 kΩ and VE = 1.3 V: IE ≈",["0.87 mA","1.3 mA","2 mA","0.7 mA"],0,"VE/RE."],
["Exact method: ETh =",["VCC·R2/(R1+R2)","VCC·R1/(R1+R2)","VCC","VCC·R1R2"],0,"Thevenin voltage."],

{t:"Collector feedback, emitter-follower, common-base & misc. bias (4.6–4.9)",q:[
["Collector feedback: IB =",["(VCC − VBE)/(RB + β(RC + RE))","(VCC − VBE)/RB","VCC/RC","(VCC − VBE)/(RB+RE)"],0,"IC flows through RC and RE."],
["Feedback from collector to base gives:",["improved stability","a bigger β","no change","ac gain only"],0,"Rising IC lowers VC and IB."],
["Collector-feedback saturation current:",["VCC/(RC + RE)","VCC/RB","VCC/RE","VCC·RC"],0,"Same as emitter bias."],
["Emitter follower: output is taken at the:",["emitter","collector","base","VCC"],0,"The collector is common."],
["Emitter follower: VCE =",["VCC − IE·RE","VCC − IC·RC","VCC","0"],0,"RC is zero or ignored."],
["Emitter-follower IB =",["(VCC − VBE)/(RB + (β+1)RE)","(VCC − VBE)/RB","VCC/RE","VBE/RE"],0,"Same as emitter bias."],
["Common-base bias: IE =",["(VEE − VBE)/RE","VCC/RC","VEE/RB","VEE·RE"],0,"KVL on the emitter loop."],
["CB: IC ≈",["IE","IB","β·IE","0"],0,"α ≈ 1."],
["CB: VCB =",["VCC − IC·RC","VCC","IC·RC","VEE"],0,"Collector-loop KVL."],
["Collector feedback reflects RC into the base loop as:",["βRC","RC/β","RC","0"],0,"β(RC + RE) in the denominator."]]},
{t:"Design operations (4.11)",q:[
["Design: RE =",["VE/IE","VCC/IE","VCE/IC","VBE/IB"],0,"Ohm’s law."],
["A common rule sets VE ≈",["VCC/10","VCC","0","2VCC"],0,"Good stability without wasting headroom."],
["RC =",["VRC/IC","VCE/IC","VE/IE","VCC/IB"],0,"Drop across RC over IC."],
["For maximum swing choose VCE ≈",["VCC/2","VCC","0.3 V","0"],0,"Mid load line."],

["After design, you should:",["re-check the Q-point with standard values","ignore it","change β","skip checks"],0,"Tolerances shift the Q-point."],
["For voltage-divider design, R2 chosen so that:",["βRE ≥ 10R2","R2 = 0","R2 = ∞","R2 = RE"],0,"Keeps the divider stiff."],
["Design uses VBE =",["0.7 V for Si","0 V","VCC","5 V"],0,"Standard assumption."],

["Design starts from:",["specified VCC, ICQ and VCEQ","β only","resistor colours","VBE"],0,"Specs define the Q-point."]]},
{t:"Multiple BJT networks, current mirrors & current sources (4.12–4.14)",q:[

["Direct-coupled: VB2 =",["VC1","VE1","0","VCC"],0,"The collector feeds the next base."],

["A current source BJT must stay in the:",["active region","saturation","cutoff","breakdown"],0,"Otherwise the current isn’t constant."]]},
{t:"pnp, switching, troubleshooting & bias stability (4.15–4.18)",q:[
["pnp analysis uses equations like npn but with:",["reversed polarities and current directions","different β","no VBE","ac only"],0,"Same form, opposite signs."],
["Transistor switch: cutoff acts as:",["an open switch","a closed switch","a resistor","a battery"],0,"IC ≈ 0."],
["Saturation acts as a:",["closed switch (VCE ≈ 0.3 V)","open switch","diode","capacitor"],0,"Large IC, small VCE."],
["To saturate a switch: IB ≥",["ICsat/β","ICsat·β","VCC/β","0"],0,"Ensures saturation."],
["Switching times: ton =",["td + tr","ts + tf","td + ts","tr + tf"],0,"toff = ts + tf."],
["Troubleshooting: VCE ≈ VCC suggests:",["cutoff (no base drive)","saturation","normal","short"],0,"IC ≈ 0."],
["VCE ≈ 0 V suggests:",["saturation or a short C–E","cutoff","normal","open RC"],0,"Large IC."],
["Stability factor S(ICO) =",["ΔIC/ΔICO","ΔIB/ΔIC","ΔVBE/ΔIC","β"],0,"Lower is better."],
["Fixed-bias S(ICO) =",["β + 1","1","0","β/2"],0,"Worst stability."],
["Best stability (lowest S) occurs in:",["voltage-divider bias","fixed bias","emitter follower with no RE","open base"],0,"S approaches 1."]]}
];
CH[3].notes=[
{h:"Bias equations",b:"<div class='eq'>Fixed: I<sub>B</sub>=(V<sub>CC</sub>−V<sub>BE</sub>)/R<sub>B</sub><br>Emitter: I<sub>B</sub>=(V<sub>CC</sub>−V<sub>BE</sub>)/(R<sub>B</sub>+(β+1)R<sub>E</sub>)<br>Divider (exact): E<sub>Th</sub>=V<sub>CC</sub>R<sub>2</sub>/(R<sub>1</sub>+R<sub>2</sub>), R<sub>Th</sub>=R<sub>1</sub>‖R<sub>2</sub>, I<sub>B</sub>=(E<sub>Th</sub>−V<sub>BE</sub>)/(R<sub>Th</sub>+(β+1)R<sub>E</sub>)<br>Divider (approx, βR<sub>E</sub> ≥ 10R<sub>2</sub>): V<sub>B</sub>=V<sub>CC</sub>R<sub>2</sub>/(R<sub>1</sub>+R<sub>2</sub>), V<sub>E</sub>=V<sub>B</sub>−0.7<br>Collector fb: I<sub>B</sub>=(V<sub>CC</sub>−V<sub>BE</sub>)/(R<sub>B</sub>+β(R<sub>C</sub>+R<sub>E</sub>))</div>"},
{h:"Workflow for any bias problem",b:"<ul><li>Write KVL for the base–emitter loop to get I<sub>B</sub>, then I<sub>C</sub> = βI<sub>B</sub>.</li><li>Write KVL for the collector–emitter loop to get V<sub>CE</sub>.</li><li>Check: V<sub>CE(sat)</sub> ≈ 0.3 V → saturated; I<sub>C</sub> ≈ 0 → cutoff.</li></ul>"},
{h:"Stability",b:"<ul><li>S(I<sub>CO</sub>): fixed β+1; emitter/divider far smaller.</li><li>Fixed bias depends on β; divider is nearly independent.</li></ul>"},
{h:"Switching, mirrors, sources",b:"<ul><li>Switch: cutoff = open, saturation = closed; I<sub>B</sub> ≥ I<sub>Csat</sub>/β. t<sub>on</sub> = t<sub>d</sub> + t<sub>r</sub>; t<sub>off</sub> = t<sub>s</sub> + t<sub>f</sub>.</li><li>Mirror: I<sub>O</sub> ≈ I<sub>REF</sub> = (V<sub>CC</sub>−V<sub>BE</sub>)/R.</li><li>Darlington: β<sub>D</sub> = β<sub>1</sub>β<sub>2</sub>, V<sub>BE</sub> ≈ 1.4 V.</li></ul>"}];
CH.push({n:5,title:"BJT AC Analysis",topics:[
{t:"Amplification & the re model (5.2–5.4)",q:[

CH.push({n:6,title:"Field-Effect Transistors",topics:[
{t:"JFET construction & characteristics (6.1–6.2)",q:[
["A JFET is a ______ controlled device.",["voltage","current","power","temperature"],0,"VGS controls ID, unlike the BJT."],

["The gate current of a JFET is:",["IG ≈ 0 A","equal to ID","equal to IS","β·ID"],0,"The reverse-biased gate junction passes almost no current."],
["For an n-channel JFET, VGS is normally:",["zero or negative","positive","large positive","equal to VDS"],0,"The gate-source junction must stay reverse biased."],
["At VGS = 0 V (VDS > |VP|), ID =",["IDSS","0","IS/2","VP"],0,"IDSS is the maximum drain current."],
["In the pinch-off (saturation) region, ID:",["stays nearly constant as VDS increases","rises linearly with VDS","falls to zero","becomes negative"],0,"The channel is pinched, so VGS controls ID."],
["In the ohmic region the JFET acts as a:",["voltage-controlled resistor","current source","open circuit","capacitor"],0,"ID varies linearly with VDS."],
["As VGS becomes more negative, ID:",["decreases","increases","stays equal to IDSS","reverses"],0,"The depletion region widens and the channel narrows."],
["Compared with a BJT, a JFET is generally:",["less temperature sensitive","more temperature sensitive","current controlled","lower in input resistance"],0,"One of its key advantages."]]},
{t:"Transfer characteristics & Shockley equation (6.3)",q:[
["Shockley’s equation:",["ID = IDSS(1 − VGS/VP)²","ID = IDSS(1 − VGS/VP)","ID = IDSS·VGS/VP","ID = IDSS(VGS − VP)"],0,"A square-law relation."],
["VGS = 0: ID =",["IDSS","0","IDSS/4","VP"],0,"Maximum current."],
["VGS = VP: ID =",["0","IDSS","IDSS/2","IDSS/4"],0,"The channel is fully pinched off (cutoff)."],
["VGS = VP/2: ID =",["IDSS/4","IDSS/2","IDSS","0"],0,"(1 − 1/2)² = 1/4."],
["IDSS = 8 mA, VP = −4 V, VGS = −2 V: ID =",["2 mA","4 mA","6 mA","1 mA"],0,"8 × (0.5)²."],
["IDSS = 8 mA, VP = −4 V, VGS = −1 V: ID =",["4.5 mA","6 mA","2 mA","7 mA"],0,"8 × 0.75²."],
["The transfer curve is:",["parabolic (non-linear)","a straight line","exponential like a diode","a step"],0,"Square-law dependence."],
["The transfer characteristic plots:",["ID versus VGS","ID versus VDS","IG versus VGS","VGS versus VP"],0,"Unlike the drain characteristics."],
["ID ≈ IDSS/2 occurs near VGS ≈",["0.3 VP","0.5 VP","0.7 VP","VP"],0,"Handy plotting point."],
["Shockley’s equation applies in the:",["saturation (pinch-off) region","ohmic region only","breakdown region","cutoff only"],0,"VDS ≥ |VP| + VGS."]]},
{t:"Spec sheets, instrumentation & important relationships (6.4–6.6)",q:[
["VGS(off) on a data sheet is the same as:",["VP","IDSS","BVGSS","gm"],0,"The pinch-off voltage."],
["BVGSS is the:",["gate-source breakdown voltage","drain current","pinch-off voltage","transconductance"],0,"A maximum reverse rating."],
["IDSS is the:",["maximum drain current (VGS = 0)","gate leakage","cutoff current","source current at pinch-off"],0,"A spec sheet value."],
["IGSS is the:",["gate leakage current","saturation current","drain current","base current"],0,"Very small."],
["Important relations for a JFET:",["IG ≈ 0 and ID = IS","IG = ID","IS = 0","ID = 0"],0,"The gate draws no current."],
["JFETs suit voltmeter input stages because of:",["their high input impedance","their low impedance","low β","high power"],0,"Little loading of the circuit."],
["PD(max) =",["VDS·ID","VGS·ID","IDSS·VP","VDD·IG"],0,"Like a BJT’s PCmax."],
["For an n-channel JFET, data sheets give VGS(off) as:",["negative","positive","zero","infinite"],0,"A p-channel device is the opposite."],
["Units of the same JFET type:",["vary widely, so min/max values are listed","are identical","never vary","have no data"],0,"Use the worst-case values in design."],
["JFETs can be used as:",["voltage-variable resistors","rectifiers only","inductors","capacitors"],0,"In the ohmic region."]]},
{t:"Depletion-type MOSFET (6.7)",q:[
["A depletion-type MOSFET conducts at VGS =",["0 V (IDSS)","only above VT","only above 5 V","never"],0,"A channel exists physically."],
["The gate is insulated from the channel by:",["SiO₂","a p–n junction","a metal strip","air"],0,"Hence the name insulated-gate FET."],
["Input impedance is about:",["10¹⁰–10¹⁵ Ω","1 kΩ","26 Ω","100 Ω"],0,"Even higher than a JFET’s."],
["An n-channel depletion MOSFET can operate with:",["both negative (depletion) and positive (enhancement) VGS","only negative VGS","only positive VGS","VGS = 0 only"],0,"Unlike a JFET."],
["For positive VGS (n-channel), ID is:",["greater than IDSS","less than IDSS","zero","negative"],0,"The channel is enhanced."],
["The drain current follows:",["the same Shockley equation as a JFET","an exponential law","a linear law","Ohm’s law"],0,"ID = IDSS(1 − VGS/VP)²."],
["The substrate of an n-channel D-MOSFET is:",["p-type","n-type","metal","intrinsic"],0,"The channel is an n region."],
["The gate current is:",["≈ 0 A","equal to ID","β·ID","large"],0,"The gate is insulated."],
["In the symbol, the substrate arrow for n-channel points:",["inward","outward","upward only","absent"],0,"For p-channel it points outward."],
["At VGS = VP: ID =",["0","IDSS","IDSS/4","2IDSS"],0,"Cutoff."]]},
{t:"Enhancement-type MOSFET (6.8)",q:[
["At VGS = 0, an E-MOSFET has:",["no channel (ID = 0)","a full channel","ID = IDSS","a short"],0,"A normally-off device."],
["VGS(Th) is the:",["threshold voltage at which the channel forms","pinch-off voltage","breakdown voltage","supply voltage"],0,"Also written VT."],
["Drain current:",["ID = k(VGS − VT)²","ID = IDSS(1 − VGS/VP)²","ID = kVGS","ID = k/VGS"],0,"Square law above threshold."],
["k =",["ID(on)/(VGS(on) − VT)²","ID(on)·(VGS(on) − VT)","IDSS/VP²","VT/ID(on)"],0,"From a known point."],
["ID(on) = 6 mA at VGS(on) = 8 V, VT = 3 V: k =",["0.24 mA/V²","0.75 mA/V²","2 mA/V²","0.12 mA/V²"],0,"6 mA / 5² V²."],
["For VGS < VT, ID =",["0","k","IDSS","VT"],0,"No channel."],
["The E-MOSFET symbol shows a:",["broken (dashed) channel line","solid channel line","no gate","diode only"],0,"No channel at 0 V."],
["An n-channel E-MOSFET needs ______ VGS.",["positive","negative","zero","any"],0,"Above VT."],
["The transfer curve:",["starts at VT and rises parabolically","starts at VP","is a straight line from 0","is flat"],0,"Unlike the JFET."],
["E-MOSFETs are widely used in:",["digital circuits and VLSI","vacuum tubes","only audio","rectifiers"],0,"Small and low-power, with high density."]]},
{t:"MOSFET handling, VMOS/UMOS, CMOS & MESFET (6.9–6.12)",q:[
["MOSFETs can be damaged by:",["static charge breaking down the thin gate oxide","high β","low temperature","dc only"],0,"They need careful handling."],
["A handling precaution is:",["ground yourself and keep the leads shorted until installed","wear gloves only","heat the device","apply high VGS"],0,"Avoids electrostatic damage."],
["Many MOSFETs include a protective:",["Zener at the gate","coil","fuse at the drain","capacitor to the substrate"],0,"Limits the gate voltage."],
["VMOS/UMOS devices are designed for:",["high-power operation","low-voltage logic only","RF only","display"],0,"The V or U groove shortens the channel."],
["VMOS advantages include:",["low rds(on), fast switching and positive temperature coefficient","high rds(on)","slow switching","no heating"],0,"Positive TC avoids thermal runaway."],
["CMOS uses:",["complementary p- and n-channel MOSFETs","two npn BJTs","two JFETs","only n-channel"],0,"Used in logic."],
["The main CMOS advantage is:",["very low power dissipation","very high power","low density","slow speed"],0,"One device is always off."],
["In a CMOS inverter:",["one transistor is off while the other is on","both are on","both are off always","none"],0,"So there is no static current."],
["A MESFET has a:",["Schottky (metal–semiconductor) gate","SiO₂ gate","p–n junction gate","no gate"],0,"Typically GaAs."],
["MESFETs are used in:",["high-frequency (microwave) applications","power rectifiers","low-frequency dc","mechanical switches"],0,"They are fast, with high mobility."]]}
],
notes:[
{h:"JFET basics",b:"<ul><li>Voltage-controlled, unipolar device with I<sub>G</sub> ≈ 0 and I<sub>D</sub> = I<sub>S</sub>. High input impedance.</li><li>n-channel: V<sub>GS</sub> ≤ 0. V<sub>GS</sub> = 0 → I<sub>D</sub> = I<sub>DSS</sub>; V<sub>GS</sub> = V<sub>P</sub> → I<sub>D</sub> = 0.</li><li>Regions: ohmic (voltage-controlled resistor), saturation/pinch-off (amplifier), cutoff, breakdown.</li></ul>"},
{h:"Shockley equation & plotting",b:"<div class='eq'>I<sub>D</sub> = I<sub>DSS</sub>(1 − V<sub>GS</sub>/V<sub>P</sub>)²<br>V<sub>GS</sub> = V<sub>P</sub>(1 − √(I<sub>D</sub>/I<sub>DSS</sub>))</div><p>Points: (0, I<sub>DSS</sub>), (V<sub>P</sub>/2, I<sub>DSS</sub>/4), (0.3V<sub>P</sub>, I<sub>DSS</sub>/2), (V<sub>P</sub>, 0).</p>"},
{h:"MOSFETs",b:"<ul><li>D-MOSFET: channel exists. Works with ±V<sub>GS</sub>; same Shockley equation; I<sub>D</sub> &gt; I<sub>DSS</sub> for positive V<sub>GS</sub>.</li><li>E-MOSFET: no channel until V<sub>GS</sub> &gt; V<sub>T</sub>. I<sub>D</sub> = k(V<sub>GS</sub> − V<sub>T</sub>)², k = I<sub>D(on)</sub>/(V<sub>GS(on)</sub> − V<sub>T</sub>)².</li><li>Gate is SiO₂-insulated (Z<sub>in</sub> ≈ 10¹⁰–10¹⁵ Ω). Handle against static.</li></ul>"},
{h:"VMOS, CMOS, MESFET",b:"<ul><li>VMOS/UMOS: power devices, low r<sub>ds(on)</sub>, positive temperature coefficient.</li><li>CMOS: complementary pair, very low power, used in logic.</li><li>MESFET: Schottky gate, GaAs, microwave.</li></ul>"}],
deriv:[{h:"I<sub>D</sub> = I<sub>DSS</sub>/4 at V<sub>GS</sub> = V<sub>P</sub>/2",b:"<div class='eq'>I<sub>D</sub> = I<sub>DSS</sub>(1 − (V<sub>P</sub>/2)/V<sub>P</sub>)² = I<sub>DSS</sub>(1 − ½)² = I<sub>DSS</sub>/4</div>"}]});
CH.push({n:7,title:"FET Biasing",topics:[
{t:"Fixed-bias configuration (7.2)",q:[
["In JFET fixed bias, VGS =",["−VGG","+VGG","VDD","VDS"],0,"IG = 0, so no drop across RG."],
["Because IG = 0, the voltage across RG is:",["0 V","VGG","VDD","VDS"],0,"So VG = −VGG."],
["VGG = 2 V, IDSS = 10 mA, VP = −8 V: ID =",["5.63 mA","2 mA","10 mA","7.5 mA"],0,"10 × (1 − 0.25)²."],
["VDS =",["VDD − ID·RD","VDD + ID·RD","VDD","ID·RD"],0,"Drain-source loop KVL."],
["VDD = 16 V, RD = 2 kΩ, ID = 5.63 mA: VDS ≈",["4.75 V","11.3 V","16 V","0 V"],0,"16 − 11.25."],
["VS in fixed bias =",["0 V","VGG","VDD","VDS"],0,"The source is grounded."],
["VD =",["VDD − ID·RD","VDD","0","VGS"],0,"Equals VDS here."],
["Graphically, the Q-point is at:",["the transfer curve ∩ the vertical line VGS = −VGG","the origin","VP","IDSS"],0,"The gate-source loop gives a fixed VGS."],
["If VGG = 0, ID =",["IDSS","0","IDSS/4","VP"],0,"VGS = 0."],
["A drawback of fixed bias is:",["it needs a separate negative supply","it needs RS","it has no gain","IG is large"],0,"Self-bias avoids this."]]},
{t:"Self-bias configuration (7.3)",q:[
["Self-bias: VGS =",["−ID·RS","+ID·RS","−VDD","IDSS·RS"],0,"VG = 0 and VS = IDRS."],
["The self-bias line on the transfer plot:",["passes through the origin","passes through VP","is vertical","is horizontal"],0,"VGS = −IDRS."],
["VDS =",["VDD − ID(RD + RS)","VDD − IDRD","VDD","ID·RS"],0,"KVL through RD and RS."],
["VS =",["ID·RS","VDD","0","−VGS/2"],0,"Ohm’s law."],
["RS = 1 kΩ, ID = 2 mA: VGS =",["−2 V","2 V","−0.5 V","−1 V"],0,"−IDRS."],
["Q-point is found where:",["the self-bias line crosses the transfer curve","the load line meets VP","VGS = 0","IDSS = ID"],0,"Graphical solution."],
["Self-bias needs:",["a single supply (VDD only)","two supplies","a battery for VGS","an ac source"],0,"The source resistor makes the gate negative relative to the source."],
["VD =",["VDD − ID·RD","VDD","ID·RS","0"],0,"Drain voltage."],
["Increasing RS moves the Q-point to:",["lower ID","higher ID","IDSS","no change"],0,"The line becomes steeper."],
["VG in self-bias is:",["0 V (IG = 0)","VDD","−VGS","VS"],0,"RG carries no current."]]},
{t:"Voltage-divider bias (7.4)",q:[
["VG =",["VDD·R2/(R1 + R2)","VDD·R1/(R1 + R2)","VDD","0"],0,"IG = 0, so the divider is unloaded."],
["VDD = 16 V, R1 = 2.1 MΩ, R2 = 270 kΩ: VG ≈",["1.82 V","14.2 V","16 V","0.7 V"],0,"16 × 270/2370."],
["VGS =",["VG − ID·RS","VG + ID·RS","−ID·RS","VG"],0,"KVL on the gate-source loop."],
["The bias line crosses the VGS axis at:",["VGS = VG (ID = 0)","VGS = 0","VP","IDSS"],0,"It doesn’t pass through the origin."],
["The bias line crosses the ID axis at:",["VG/RS","VDD/RS","IDSS","VP/RS"],0,"VGS = 0."],
["For an n-channel JFET, the bias line must yield:",["VGS ≤ 0 at the Q-point","VGS > 0","VGS = VDD","IG = ID"],0,"Reverse-biased gate junction."],
["Compared with self-bias, the divider gives:",["a more stable Q-point","a less stable Q-point","no difference","no Q-point"],0,"Less sensitive to device spread."],
["VS =",["ID·RS","VG","0","VDD"],0,"Source resistor drop."],
["VDS =",["VDD − ID(RD + RS)","VDD − IDRD","VG − VS","VDD"],0,"Loop KVL."],
["R1 and R2 are usually large to keep:",["input impedance high","gain low","IG high","VP high"],0,"Typically MΩ."]]},
{t:"Common-gate configuration & special case VGSQ = 0 (7.5–7.6)",q:[
["In the common-gate (CG) configuration, the input is applied at the:",["source","gate","drain","substrate"],0,"The gate is grounded for ac."],
["The CG output is taken at the:",["drain","source","gate","VDD"],0,"Like the BJT CB."],
["CG input impedance is:",["low (≈ 1/gm)","very high","infinite","MΩ"],0,"The source is the input terminal."],
["Special case VGSQ = 0: ID =",["IDSS","0","IDSS/4","VP"],0,"The Q-point is on the vertical axis."],
["With VGSQ = 0: VDS =",["VDD − IDSS·RD","VDD","0","IDSS·RS"],0,"RS = 0 or the gate-source drop is zero."],
["ID = IDSS holds only if:",["VDS ≥ |VP| (pinch-off region)","VDS = 0","VDD = 0","ID < 0"],0,"Otherwise the device is in the ohmic region."],
["Shockley’s equation is still used in CG:",["yes, for finding ID","no","only at cutoff","only at IDSS"],0,"The bias analysis is the same."],
["In bias analysis, IG for a FET is:",["≈ 0","= ID","= IS","large"],0,"Gate leakage only."],
["CG is mainly useful at:",["high frequencies","dc only","audio only","power rectification"],0,"Good isolation, low input C."],
["In VGSQ = 0 case, the gate and source are at:",["the same dc potential","opposite polarity","VDD","−VDD"],0,"By definition."]]},
{t:"Depletion-type MOSFET bias (7.7)",q:[
["The self-bias analysis for a D-MOSFET is:",["the same as for a JFET","entirely different","not possible","for BJTs"],0,"Same Shockley equation."],
["A D-MOSFET can be biased with VGS:",["positive, zero or negative","negative only","zero only","positive only"],0,"Unlike the JFET."],
["The simplest D-MOSFET bias (VGS = 0) gives ID =",["IDSS","0","IDSS/4","VP"],0,"Direct bias."],
["In voltage-divider bias, the Q-point can have:",["VGS > 0","VGS = VP always","ID = 0 always","IG = ID"],0,"If the bias line crosses above the axis."],
["The bias line meets the VGS axis at VG, which can be:",["positive","only negative","only zero","undefined"],0,"For a D-MOSFET, that’s allowed."],
["For positive VGS, ID is:",["greater than IDSS","less than IDSS","zero","equal to IDSS"],0,"Enhancement mode."],
["VDS =",["VDD − ID(RD + RS)","VDD","ID·RD","VGS"],0,"Loop KVL."],
["IG =",["0 (insulated gate)","ID","IS","large"],0,"The gate is insulated."],
["The graphical method uses the:",["transfer curve and the bias line","load line only","Q-point only","h-parameters"],0,"Same as for JFETs."],
["IDSS = 6 mA, VP = −3 V, VGS = +1 V: ID ≈",["10.7 mA","6 mA","8 mA","2 mA"],0,"6 × (1 + 1/3)²."]]},
{t:"Enhancement-type MOSFET bias (7.8)",q:[
["In drain-feedback bias, VGS =",["VDS","VDD","0","ID·RS"],0,"IG = 0, so VDG = 0."],
["Drain feedback: VDS =",["VDD − ID·RD","VDD","VDD + ID·RD","0"],0,"KVL, and VGS = VDS."],
["Because VDS = VGS > VT, the MOSFET is in:",["saturation","the ohmic region","cutoff","breakdown"],0,"VDS > VGS − VT."],
["Voltage-divider: VGS =",["VG − ID·RS","VG","−ID·RS","VDD"],0,"VG = VDD·R2/(R1 + R2)."],
["Drain current:",["ID = k(VGS − VT)²","ID = IDSS(1 − VGS/VP)²","ID = VGS/RD","ID = kVGS"],0,"Square law."],
["k =",["ID(on)/(VGS(on) − VT)²","ID(on)·VT","VT/ID","IDSS/VP"],0,"From a data point."],
["For the device to conduct, VGS must be:",["greater than VT","less than VT","zero","negative"],0,"n-channel."],
["k from ID(on) = 6 mA, VGS(on) = 8 V, VT = 3 V:",["0.24 mA/V²","0.75 mA/V²","2 mA/V²","1.2 mA/V²"],0,"6/25."],
["VG in divider bias =",["VDD·R2/(R1 + R2)","VDD","VDD·R1/R2","0"],0,"IG = 0."],
["The Q-point is found by:",["intersecting the bias line with the transfer curve","using VP","IDSS","β"],0,"Or solving the quadratic."]]},
{t:"Combination networks, design & troubleshooting (7.10–7.12)",q:[
["For a combination network, start with:",["KVL on the gate-source loop (IG = 0)","the output loop only","β","VP"],0,"Gives VGS in terms of ID."],
["A common design target is ID about:",["IDSS/2","IDSS·2","0","VP"],0,"Mid-range bias."],
["RS =",["|VGS|/ID","VDD/ID","VP/IDSS","VDS/ID"],0,"From the bias point."],
["RD =",["(VDD − VDS − ID·RS)/ID","VDD/ID","VDS/ID","VDD·ID"],0,"Loop KVL."],
["Design VDS is often chosen near:",["VDD/2","VDD","0","VP"],0,"Room for symmetric swing."],
["VDS ≈ VDD suggests:",["ID ≈ 0 (device off or open)","saturation","normal bias","a short"],0,"No drop across RD."],
["VDS ≈ 0 suggests:",["a short or a very large ID","cutoff","normal","open gate"],0,"Check RD and the device."],
["Troubleshooting begins with:",["measuring the dc voltages","replacing the device","scoping the output","adding feedback"],0,"Compare with calculated values."],
["A significant gate current indicates:",["a damaged gate","normal operation","saturation","cutoff"],0,"IG should be ≈ 0."],
["Standard resistor values:",["cause small deviations from the design Q","have no effect","change β","are exact"],0,"Re-check the Q-point."]]},
{t:"p-channel FETs & universal JFET bias curve (7.13–7.14)",q:[
["For p-channel devices, compared with n-channel:",["polarities and current directions are reversed","equations are different","VP = 0","IDSS = 0"],0,"Same equations, mirrored signs."],
["A p-channel JFET has VP:",["positive","negative","zero","infinite"],0,"VGS ≥ 0 in operation."],
["In p-channel self-bias, VGS =",["+ID·RS","−ID·RS","−VDD","0"],0,"The source is above the gate."],
["p-channel drain current direction:",["from source toward drain","from drain to source","none","random"],0,"Opposite to the n-channel case."],
["Shockley’s equation for p-channel:",["has the same form","doesn’t apply","uses ln","is linear"],0,"ID = IDSS(1 − VGS/VP)²."],

["The normalised bias parameter m =",["|VP/(IDSS·RS)|","VP·IDSS·RS","IDSS/VP","RS/RD"],0,"Determines the slope of the bias line."],

["p-channel bias: VDD polarity is:",["negative (or reversed)","positive","zero","ac"],0,"Reversed supply."]]}

notes:[
{h:"Golden rules of FET biasing",b:"<ul><li>I<sub>G</sub> = 0 ⇒ no voltage drop across R<sub>G</sub>; I<sub>D</sub> = I<sub>S</sub>.</li><li>Gate-source loop gives V<sub>GS</sub>; solve with Shockley (JFET/D-MOSFET) or I<sub>D</sub> = k(V<sub>GS</sub> − V<sub>T</sub>)² (E-MOSFET). The drain loop gives V<sub>DS</sub>.</li></ul>"},
{h:"Bias equations",b:"<div class='eq'>Fixed: V<sub>GS</sub> = −V<sub>GG</sub>, V<sub>DS</sub> = V<sub>DD</sub> − I<sub>D</sub>R<sub>D</sub><br>Self: V<sub>GS</sub> = −I<sub>D</sub>R<sub>S</sub>, V<sub>DS</sub> = V<sub>DD</sub> − I<sub>D</sub>(R<sub>D</sub>+R<sub>S</sub>)<br>Divider: V<sub>G</sub> = V<sub>DD</sub>R<sub>2</sub>/(R<sub>1</sub>+R<sub>2</sub>), V<sub>GS</sub> = V<sub>G</sub> − I<sub>D</sub>R<sub>S</sub><br>E-MOSFET drain-feedback: V<sub>GS</sub> = V<sub>DS</sub> = V<sub>DD</sub> − I<sub>D</sub>R<sub>D</sub></div>"},
{h:"Graphical method",b:"<ul><li>Plot the transfer curve. Fixed: vertical line at −V<sub>GG</sub>. Self: line through the origin with slope −1/R<sub>S</sub>. Divider: line from (V<sub>G</sub>, 0) to (0, V<sub>G</sub>/R<sub>S</sub>).</li><li>Q-point = intersection.</li></ul>"},
{h:"Design, troubleshooting, p-channel",b:"<ul><li>Design: pick I<sub>D</sub> ≈ I<sub>DSS</sub>/2, R<sub>S</sub> = |V<sub>GS</sub>|/I<sub>D</sub>, V<sub>DS</sub> ≈ V<sub>DD</sub>/2.</li><li>V<sub>DS</sub> ≈ V<sub>DD</sub> → I<sub>D</sub> ≈ 0; V<sub>DS</sub> ≈ 0 → short or large I<sub>D</sub>.</li><li>p-channel: reverse polarities and current direction; same equations.</li></ul>"}],
deriv:[{h:"Self-bias line",b:"<p>Gate at 0 V (I<sub>G</sub> = 0) and source at V<sub>S</sub> = I<sub>D</sub>R<sub>S</sub>.</p><div class='eq'>V<sub>GS</sub> = V<sub>G</sub> − V<sub>S</sub> = −I<sub>D</sub>R<sub>S</sub> ⇒ I<sub>D</sub> = −V<sub>GS</sub>/R<sub>S</sub></div><p>A straight line through the origin. Its intersection with the transfer curve is the Q-point.</p>"},
{h:"E-MOSFET constant k",b:"<p>From I<sub>D</sub> = k(V<sub>GS</sub> − V<sub>T</sub>)² at a known point (V<sub>GS(on)</sub>, I<sub>D(on)</sub>):</p><div class='eq'>k = I<sub>D(on)</sub>/(V<sub>GS(on)</sub> − V<sub>T</sub>)²</div>"}]});

{t:"General frequency considerations & normalization (9.4–9.5)",q:[
["In the midband, coupling and bypass capacitors act as:",["short circuits","open circuits","resistors","inductors"],0,"Reactance is negligible."],
["Low-frequency gain falls due to:",["coupling and bypass capacitors","stray capacitances","transistor β","VCC"],0,"Their reactance grows."],
["High-frequency gain falls due to:",["stray and internal device capacitances","coupling capacitors","RE","dc supply"],0,"Their reactance shrinks, shunting the signal."],
["Half-power frequencies are where gain =",["0.707 of midband","0.5 of midband","0.1 of midband","midband"],0,"−3 dB."],
["Bandwidth =",["f2 − f1","f2 + f1","f2/f1","f1 − f2"],0,"Between the half-power frequencies."],
["The −3 dB point equals:",["half power","half voltage","double power","zero power"],0,"P = P_mid/2."],
["Normalizing means dividing the gain by:",["the midband gain","the supply","β","fL"],0,"Av/Av(mid), which is 1 in the midband."],
["At f = f₁, |Av/Av(mid)| =",["1/√2","1/2","1","0"],0,"0.707."],
["An RC roll-off is:",["−20 dB/decade (−6 dB/octave)","−40 dB/decade","−3 dB/decade","0"],0,"A single-pole slope."],
["Raising the gain of a stage typically:",["narrows the bandwidth","widens the bandwidth","doesn’t change it","removes poles"],0,"A gain–bandwidth trade-off."]]},
{t:"Low-frequency analysis — Bode plot (9.6)",q:[
["RC high-pass cutoff: f₁ =",["1/(2πRC)","2πRC","RC/2π","1/RC"],0,"At XC = R."],
["Av/Av(mid) =",["1/(1 − j f₁/f)","1/(1 + j f₁/f)","1 − j f/f₁","f₁/f"],0,"High-pass response."],
["At f = f₁ the phase is:",["+45°","−45°","90°","0°"],0,"Phase lead."],
["Below f₁ the asymptote slope is:",["+20 dB/decade","−20 dB/decade","0","+40 dB/decade"],0,"Gain rises with f."],
["A Bode plot uses:",["straight-line asymptotes","exact curves only","random points","tables"],0,"A quick approximation."],
["The maximum error at f₁ between actual and asymptote is:",["3 dB","6 dB","0 dB","10 dB"],0,"Actual −3 dB vs 0 dB."],
["R = 1 kΩ, C = 1 μF: f₁ ≈",["159 Hz","1 kHz","16 Hz","1.6 kHz"],0,"1/(2π·10⁻³)."],
["At f = f₁/10 the asymptotic gain is:",["−20 dB","−3 dB","−10 dB","0 dB"],0,"One decade below the corner."],
["An octave is a frequency ratio of:",["2:1","10:1","3:1","1:2 only"],0,"A decade is 10:1."],
["At f = f₁/2 the asymptotic gain is:",["−6 dB","−3 dB","−12 dB","0 dB"],0,"One octave below."]]},
{t:"Low-frequency response — BJT amplifier, RL and Rs (9.7–9.8)",q:[
["Input coupling: fLs =",["1/[2π(Rs + Ri)Cs]","1/[2πRsCs]","1/[2πRiCs]","Cs/2πR"],0,"Series R seen by Cs."],
["Output coupling: fLc =",["1/[2π(Ro + RL)Cc]","1/[2πRLCc]","1/[2πRoCc]","1/Cc"],0,"R seen by Cc."],
["Emitter bypass: fLE =",["1/(2πReCE)","1/(2πRECE)","RE/2πCE","1/(2πRCCE)"],0,"Re = RE‖(Rs′/β + re)."],
["The overall low cutoff is set by:",["the highest fL (dominant)","the lowest fL","the average","fHi"],0,"The nearest to midband."],
["Ri (voltage divider) =",["R1‖R2‖βre","R1 + R2","βre","RC"],0,"Input resistance."],
["The emitter bypass capacitor typically gives:",["the highest fL","the lowest fL","fL = 0","no effect"],0,"Re is very small, so fLE is large."],
["Larger capacitors give:",["a lower fL","a higher fL","no change","a flat phase"],0,"Longer time constants."],
["Adding source resistance Rs:",["raises Rs + Ri and lowers fLs","raises fLs","kills gain only","removes Cs"],0,"The time constant grows."],
["At each capacitor’s cutoff the gain drops:",["3 dB","6 dB","20 dB","0 dB"],0,"One pole."],
["To extend low-frequency response:",["increase coupling/bypass capacitance","decrease it","remove them","raise Rs"],0,"Lowers every fL."]]},
{t:"Low-frequency FET response & Miller effect (9.9–9.10)",q:[
["FET input coupling: fLG =",["1/[2π(Rsig + Ri)CG]","1/[2πRsigCG]","1/[2πRDCG]","CG/2πRi"],0,"Ri = RG."],
["FET output coupling: fLC =",["1/[2π(Ro + RL)CC]","1/[2πRLCC]","1/[2πRG·CC]","CC/R"],0,"Ro = RD‖rd."],
["FET source bypass: fLS =",["1/(2πReqCS), Req ≈ RS‖1/gm","1/(2πRSCS)","1/(2πRDCS)","gm/2πCS"],0,"The effective source resistance."],
["fLG is usually very low because:",["RG is very large","RG is tiny","gm is large","CG is tiny"],0,"The FET input resistance is huge."],
["Miller input capacitance: CMi =",["(1 − Av)Cf","(1 + Av)Cf","Cf/Av","Cf·Av"],0,"Av is negative for an inverting stage."],
["Miller output capacitance: CMo ≈",["Cf (for large |Av|)","Av·Cf","0","Cf/Av"],0,"(1 − 1/Av)Cf."],
["Av = −100, Cf = 5 pF: CMi =",["505 pF","500 pF","5 pF","95 pF"],0,"(1 + 100) × 5."],
["The Miller effect ______ the effective input capacitance.",["increases","decreases","doesn’t change","zeros"],0,"For inverting stages."],
["The Miller effect mainly reduces:",["high-frequency response","low-frequency response","dc gain","β"],0,"It lowers fHi."],
["Miller capacitance arises from a:",["capacitor bridging input and output","capacitor to ground only","coil","resistor"],0,"Feedback capacitance."]]},
{t:"High-frequency response — BJT & FET (9.11–9.12)",q:[
["BJT input side: fHi =",["1/(2πRThiCi)","1/(2πRCCi)","RThi/2πCi","Ci/2πR"],0,"With Ci = CWi + Cbe + CMi."],
["BJT output side: fHo =",["1/(2πRThoCo)","1/(2πRLCo)","1/(2πRECo)","Co/2π"],0,"Co = CWo + Cce + CMo."],
["Internal BJT capacitances are:",["Cbe, Cbc, Cce","Cs, Cc, CE","L1, L2","none"],0,"Plus the wiring capacitances."],
["fβ is where β falls to:",["0.707 β₀","0.5 β₀","β₀","0.1 β₀"],0,"The −3 dB point of β."],
["fT is the frequency where β =",["1 (unity)","β₀","0.707","10"],0,"fT ≈ β₀·fβ."],
["fβ =",["1/[2πβre(Cπ + Cμ)]","1/(2πreCπ)","βre/2πC","β/2π"],0,"Hybrid-π result."],
["FET input capacitance Ci =",["CWi + Cgs + CMi","Cgd only","CWo + Cds","Cgs only"],0,"CMi = (1 − Av)Cgd."],
["FET output capacitance Co =",["CWo + Cds + CMo","CWi + Cgs","Cgd only","Cgs"],0,"Same form as the BJT."],
["The overall fH is set by:",["the lower of fHi and fHo","the higher","their sum","their product"],0,"The dominant pole."],
["A larger Rs ______ fHi.",["lowers","raises","doesn’t change","doubles"],0,"A larger Rs raises RThi, so fHi falls."]]},
{t:"Multistage frequency effects & square-wave testing (9.13–9.14)",q:[
["For n identical stages: f₂′ =",["f₂·√(2^(1/n) − 1)","f₂/n","n·f₂","f₂"],0,"The overall bandwidth shrinks."],
["For n identical stages: f₁′ =",["f₁/√(2^(1/n) − 1)","n·f₁","f₁/n","f₁"],0,"The low cutoff rises."],
["Two identical stages: f₂′ ≈",["0.64 f₂","0.5 f₂","0.9 f₂","f₂"],0,"√(√2 − 1) = 0.644."],
["Cascaded gains:",["multiply (add in dB)","add","subtract","average"],0,"AvT = Av1 × Av2."],
["A square-wave test shows the high-frequency response through the:",["rise time","tilt","amplitude","duty cycle"],0,"Slow edges mean poor fH."],
["Tilt (sag) of the flat top indicates the:",["low-frequency response","high-frequency response","β","power"],0,"Capacitor droop."],
["BW ≈",["0.35/tr","tr/0.35","0.7/tr","1/tr"],0,"The rise-time relation."],
["Rise time tr is measured from:",["10% to 90% of the final value","0 to 100%","50% to 100%","0 to 50%"],0,"By definition."],
["Tilt P = (V − V′)/V and fL ≈",["P·fs/π","P·fs","π·fs/P","fs/P"],0,"fs is the square-wave frequency."],
["A square wave of perfect fidelity requires:",["a wide bandwidth (low fL, high fH)","a narrow bandwidth","only one frequency","only dc"],0,"It contains many harmonics."]]}
],
notes:[
{h:"Decibels & logs",b:"<div class='eq'>G<sub>dB</sub> = 10 log<sub>10</sub>(P<sub>2</sub>/P<sub>1</sub>) = 20 log<sub>10</sub>(V<sub>2</sub>/V<sub>1</sub>) (equal impedances)</div><ul><li>×2 power = +3 dB; ×2 voltage = +6 dB; ×10 voltage = +20 dB; cascaded gains add in dB.</li><li>Half-power point = −3 dB = 0.707 A<sub>v(mid)</sub>. BW = f<sub>2</sub> − f<sub>1</sub>.</li></ul>"},
{h:"Low-frequency cutoffs",b:"<div class='eq'>f<sub>Ls</sub> = 1/[2π(R<sub>s</sub>+R<sub>i</sub>)C<sub>s</sub>] · f<sub>Lc</sub> = 1/[2π(R<sub>o</sub>+R<sub>L</sub>)C<sub>C</sub>] · f<sub>LE</sub> = 1/(2πR<sub>e</sub>C<sub>E</sub>)</div><p>R<sub>e</sub> = R<sub>E</sub>‖(R<sub>s</sub>′/β + r<sub>e</sub>). The highest f<sub>L</sub> dominates. A single RC gives ±20 dB/decade slopes with ±45° phase at the corner.</p>"},
{h:"High-frequency cutoffs & Miller",b:"<div class='eq'>f<sub>Hi</sub> = 1/(2πR<sub>Thi</sub>C<sub>i</sub>), C<sub>i</sub> = C<sub>Wi</sub> + C<sub>be</sub> + (1−A<sub>v</sub>)C<sub>bc</sub><br>f<sub>Ho</sub> = 1/(2πR<sub>Tho</sub>C<sub>o</sub>), C<sub>o</sub> = C<sub>Wo</sub> + C<sub>ce</sub> + C<sub>Mo</sub></div><p>f<sub>β</sub>: β falls to 0.707β<sub>0</sub>; f<sub>T</sub> ≈ β<sub>0</sub>f<sub>β</sub>. The lower of f<sub>Hi</sub>, f<sub>Ho</sub> dominates.</p>"},
{h:"Multistage & square-wave testing",b:"<ul><li>n identical stages: f<sub>2</sub>′ = f<sub>2</sub>√(2<sup>1/n</sup>−1), f<sub>1</sub>′ = f<sub>1</sub>/√(2<sup>1/n</sup>−1). Bandwidth shrinks.</li><li>BW ≈ 0.35/t<sub>r</sub>; low-frequency: f<sub>L</sub> ≈ P f<sub>s</sub>/π (P = tilt as a decimal).</li></ul>"}]});
CH.push({n:10,title:"Operational Amplifiers",topics:[
{t:"Differential amplifier circuit (10.2–10.3)",q:[
["A differential amplifier amplifies:",["the difference of its two inputs","their sum","only dc","only one input"],0,"Vo = Ad·Vd."],
["A constant-current source in the emitter circuit:",["raises CMRR","lowers CMRR","removes gain","adds offset"],0,"It gives high common-mode rejection."],
["Ad is the:",["differential-mode gain","common-mode gain","dc gain","open-loop gain only"],0,"For opposite-phase inputs."],
["Ac should be:",["very small","very large","1","negative"],0,"Common-mode gain should be near zero."],
["Single-ended output: Ad ≈",["RC/(2re)","RC/re","2RC/re","re/RC"],0,"Half of the double-ended gain."],
["Double-ended output: Ad ≈",["RC/re","RC/(2re)","re/RC","2re/RC"],0,"Output across both collectors."],
["Each-transistor dc current: IE ≈",["(VEE − VBE)/(2RE)","VEE/RE","VBE/RE","VEE/(4RE)"],0,"The two emitter currents share RE."],
["Differential input impedance: Zi =",["2βre","βre","re","RC"],0,"Two base–emitter paths in series."],
["Output impedance: Zo ≈",["RC","re","βre","2RC"],0,"Seen at each collector."],
["BiFET/BiMOS inputs give an op amp:",["very high input impedance","low input impedance","lower gain","a lower supply"],0,"FET input pair."]]},
{t:"Op-amp basics (10.4)",q:[
["An ideal op amp has:",["infinite Zi, zero Zo, infinite gain","zero Zi, infinite Zo","unity gain","β = 100"],0,"Defining ideals."],
["Virtual ground appears at the inverting input when:",["the non-inverting input is grounded","both are open","Rf = 0","the output is open"],0,"V⁻ ≈ V⁺ = 0."],
["Inverting amp: Av =",["−Rf/R1","1 + Rf/R1","Rf/R1","−R1/Rf"],0,"Standard result."],
["Non-inverting amp: Av =",["1 + Rf/R1","−Rf/R1","Rf/R1","R1/Rf"],0,"Standard result."],
["Voltage follower (unity buffer): Av =",["1","0","−1","∞"],0,"Rf = 0 and R1 = ∞."],
["Typical op-amp stages are:",["differential input, gain stage, output buffer","only one stage","a rectifier chain","a filter bank"],0,"Internal structure."],
["Vo =",["Ad(V⁺ − V⁻)","Ad(V⁺ + V⁻)","V⁺/V⁻","V⁺·V⁻"],0,"Open-loop."],
["V⁺ ≈ V⁻ because:",["Ad is very large","Ad is zero","Rf is zero","Vo is large"],0,"A tiny Vd gives a finite Vo."],
["An ideal op amp draws ______ input current.",["zero","infinite","1 A","1 mA"],0,"Infinite input impedance."],
["Open-loop gain of a typical op amp is about:",["10⁵","10","1","10⁻³"],0,"Very large."]]},
{t:"Practical op-amp circuits (10.5)",q:[
["Inverting amp: Rf = 100 kΩ, R1 = 10 kΩ: Av =",["−10","10","−11","−0.1"],0,"−Rf/R1."],
["Non-inverting: Rf = 90 kΩ, R1 = 10 kΩ: Av =",["10","9","−9","11"],0,"1 + 9."],
["Summing amp: Vo =",["−(Rf/R1·V1 + Rf/R2·V2)","(V1 + V2)","Rf(V1 + V2)","−V1V2"],0,"Weighted inverting sum."],
["Integrator: Vo =",["−(1/RC)∫Vi dt","−RC·dVi/dt","−Vi/RC","RC·Vi"],0,"A capacitor in the feedback."],
["Differentiator: Vo =",["−RC·dVi/dt","−(1/RC)∫Vi dt","Vi/RC","RC·Vi"],0,"A capacitor at the input."],
["Inverting amp input impedance ≈",["R1","very high","0","Rf"],0,"Virtual ground at the input."],
["Non-inverting amp input impedance is:",["very high","R1","0","Rf"],0,"At the + input."],
["The inverting output is:",["180° out of phase","in phase","90° shifted","unchanged"],0,"The minus sign."],
["Vi = 0.5 V, Av = −10: Vo =",["−5 V","5 V","−0.5 V","−10 V"],0,"Product."],
["A unity-gain follower is used as a:",["buffer","oscillator","rectifier","amplifier of 10"],0,"High Zi, low Zo."]]},
{t:"DC offset parameters (10.6)",q:[
["Input offset voltage VIO is the voltage needed to:",["bring Vo to 0 V with Vi = 0","double the gain","zero Zi","bias the supply"],0,"A specification of mismatch."],
["Input offset current IIO =",["|I₁ − I₂|","I₁ + I₂","(I₁ + I₂)/2","I₁·I₂"],0,"Difference of the two bias currents."],
["Input bias current IIB =",["(I₁ + I₂)/2","|I₁ − I₂|","I₁·I₂","0"],0,"The average."],
["Offsets come from:",["mismatch in the input stage","the load","the supply ripple only","the gain setting"],0,"Imperfect matching."],
["Output offset due to VIO ≈",["VIO(1 + Rf/R1)","VIO·Rf","VIO/R1","VIO"],0,"Amplified by the noise gain."],
["Offset can be nulled using:",["an offset null potentiometer","a bigger Rf","a Zener","bias current"],0,"Pins on the package."],
["Bias-current compensation uses Rcomp =",["R1‖Rf","R1 + Rf","Rf","0"],0,"Equalises the dc resistances at both inputs."],
["Typical VIO is in the:",["mV range","kV range","nV range","V range"],0,"A few mV."],
["Offset errors are ______ by the closed-loop gain.",["amplified","attenuated","ignored","phased"],0,"They appear at the output."],
["Compared with IIB, IIO is generally:",["smaller","larger","equal","infinite"],0,"A difference of nearly equal currents."]]},
{t:"Frequency parameters & unit specifications (10.7–10.8)",q:[
["Gain–bandwidth product is approximately:",["constant","zero","proportional to gain","random"],0,"Closed-loop BW = GBW/Acl."],
["Unity-gain bandwidth f₁ is where:",["open-loop gain = 1","gain = 100","gain = 0.5","gain = ∞"],0,"A key frequency spec."],
["Slew rate SR =",["ΔVo/Δt (V/μs)","Vo·t","Vo/R","Δf/Δt"],0,"Maximum rate of output change."],
["The 741’s slew rate is about:",["0.5 V/μs","50 V/μs","5000 V/μs","0.5 mV/μs"],0,"A classic value."],
["Maximum undistorted frequency: f =",["SR/(2πVp)","2πVp/SR","SR·Vp","Vp/SR"],0,"For a sine of peak Vp."],
["Closed-loop bandwidth =",["GBW/Acl","GBW·Acl","Acl/GBW","GBW"],0,"Higher gain gives lower BW."],
["Slew-rate-limited output looks:",["triangular instead of sinusoidal","larger","dc","noisy only"],0,"The output can’t keep up."],
["Open-loop gain of a 741 is about:",["200,000","20","2,000,000,000","1"],0,"AVD ≈ 2×10⁵."],
["Typical supply for a 741:",["±15 V dual","+3 V only","±100 V","0 V"],0,"Common practice."],
["A typical CMRR for a 741 is about:",["90 dB","10 dB","0 dB","300 dB"],0,"Large rejection."]]},
{t:"Differential & common-mode operation, CMRR (10.9)",q:[
["Differential input Vd =",["V₁ − V₂","V₁ + V₂","(V₁ + V₂)/2","V₁V₂"],0,"The difference."],
["Common-mode input Vc =",["(V₁ + V₂)/2","V₁ − V₂","V₁/V₂","V₁ + V₂"],0,"The average."],
["Vo =",["Ad·Vd + Ac·Vc","Ad·Vc + Ac·Vd","Ad + Ac","Ad·Ac"],0,"Superposition."],
["CMRR =",["Ad/Ac","Ac/Ad","Ad·Ac","Ad − Ac"],0,"Higher is better."],
["CMRR in dB =",["20 log₁₀(Ad/Ac)","10 log₁₀(Ad/Ac)","log₁₀(Ad·Ac)","Ad/Ac"],0,"Voltage ratio."],
["Ad = 1000, Ac = 0.1: CMRR =",["80 dB","40 dB","60 dB","100 dB"],0,"10,000 = 80 dB."],
["Ideal CMRR is:",["infinite","0","1","100"],0,"Ac = 0."],
["Common-mode rejection removes:",["noise common to both inputs","the signal","dc supply","the output"],0,"Like hum picked up on both leads."],
["V₁ = 5.01 V, V₂ = 4.99 V: Vd, Vc =",["20 mV, 5 V","10 mV, 5.01 V","5 V, 20 mV","0, 0"],0,"Difference and average."],
["A high-resistance emitter current source ______ Ac.",["lowers","raises","doubles","reverses"],0,"It limits the common-mode current."]]}
],

{h:"Ideal op amp & basic circuits",b:"<ul><li>Ideal: Z<sub>i</sub> = ∞, Z<sub>o</sub> = 0, A = ∞, I<sub>in</sub> = 0, V⁺ = V⁻.</li></ul><div class='eq'>Inverting: A<sub>v</sub> = −R<sub>f</sub>/R<sub>1</sub> · Non-inverting: A<sub>v</sub> = 1 + R<sub>f</sub>/R<sub>1</sub> · Follower: A<sub>v</sub> = 1<br>Summer: V<sub>o</sub> = −(R<sub>f</sub>/R<sub>1</sub>V<sub>1</sub> + R<sub>f</sub>/R<sub>2</sub>V<sub>2</sub>) · Integrator: V<sub>o</sub> = −(1/RC)∫V<sub>i</sub>dt · Differentiator: V<sub>o</sub> = −RC dV<sub>i</sub>/dt</div>"},
{h:"Differential amplifier",b:"<div class='eq'>I<sub>E</sub> ≈ (V<sub>EE</sub>−V<sub>BE</sub>)/(2R<sub>E</sub>), A<sub>d</sub> = R<sub>C</sub>/r<sub>e</sub> (double-ended) or R<sub>C</sub>/2r<sub>e</sub> (single-ended), Z<sub>i</sub> = 2βr<sub>e</sub></div><p>A current source in the emitter makes A<sub>c</sub> tiny and the CMRR large.</p>"},

// ===== FULL-LENGTH DERIVATIONS =====
const E=s=>"<div class='eq'>"+s+"</div>";
CH[0].deriv=[
{h:"Dynamic resistance r<sub>d</sub> = 26 mV / I<sub>D</sub>",b:"<p><b>Aim:</b> find the ac resistance at a forward-biased Q-point.</p><p><b>1. Start from Shockley (n = 1):</b></p>"+E("I<sub>D</sub> = I<sub>s</sub>(e<sup>V<sub>D</sub>/V<sub>T</sub></sup> − 1), V<sub>T</sub> = kT/q")+"<p><b>2. Thermal voltage at 300 K:</b></p>"+E("V<sub>T</sub> = (1.38×10⁻²³ J/K)(300 K)/(1.6×10⁻¹⁹ C) ≈ 25.9 mV ≈ 26 mV")+"<p><b>3. Differentiate with respect to V<sub>D</sub>:</b></p>"+E("dI<sub>D</sub>/dV<sub>D</sub> = (I<sub>s</sub>/V<sub>T</sub>) e<sup>V<sub>D</sub>/V<sub>T</sub></sup>")+"<p><b>4. Use the forward-bias approximation.</b> For V<sub>D</sub> ≫ V<sub>T</sub>, I<sub>s</sub>e<sup>V<sub>D</sub>/V<sub>T</sub></sup> ≈ I<sub>D</sub> + I<sub>s</sub> ≈ I<sub>D</sub>:</p>"+E("dI<sub>D</sub>/dV<sub>D</sub> ≈ I<sub>D</sub>/V<sub>T</sub>")+"<p><b>5. Invert (r<sub>d</sub> = ΔV/ΔI):</b></p>"+E("r<sub>d</sub> = V<sub>T</sub>/I<sub>D</sub> = 26 mV / I<sub>D</sub>")+"<p><b>Check:</b> I<sub>D</sub> = 2 mA → r<sub>d</sub> = 13 Ω; 26 mV/I<sub>D</sub> ignores the small bulk resistance r<sub>B</sub> (add 0.1–2 Ω).</p>"},
{h:"Forward voltage from current, and the doubling rule for I<sub>s</sub>",b:"<p><b>A. Diode voltage for a given current.</b> Rearranging Shockley for I<sub>D</sub> ≫ I<sub>s</sub>:</p>"+E("I<sub>D</sub> ≈ I<sub>s</sub>e<sup>V<sub>D</sub>/nV<sub>T</sub></sup> ⇒ V<sub>D</sub> = nV<sub>T</sub> ln(I<sub>D</sub>/I<sub>s</sub>)")+"<p>So V<sub>D</sub> grows only logarithmically: ×10 current adds 2.3 nV<sub>T</sub> ≈ 60 mV (n = 1), which is why V<sub>D</sub> ≈ 0.7 V over a wide current range.</p><p><b>B. Temperature rule.</b> I<sub>s</sub> doubles every 10 °C:</p>"+E("I<sub>s</sub>(T<sub>2</sub>) = I<sub>s</sub>(T<sub>1</sub>) · 2<sup>(T<sub>2</sub>−T<sub>1</sub>)/10</sup>")+"<p>Example: 25 °C → 75 °C is 50 °C, so 2⁵ = 32× larger reverse current.</p>"}];
CH[1].deriv=[
{h:"Average (dc) values of half-wave and full-wave rectifiers",b:"<p>Input v = V<sub>m</sub> sin θ. The dc value is the average over one period.</p><p><b>1. Half-wave (conducts 0 to π):</b></p>"+E("V<sub>dc</sub> = (1/2π)∫<sub>0</sub><sup>π</sup> V<sub>m</sub> sin θ dθ = (V<sub>m</sub>/2π)[−cos θ]<sub>0</sub><sup>π</sup> = (V<sub>m</sub>/2π)(2) = V<sub>m</sub>/π = 0.318V<sub>m</sub>")+"<p><b>2. Full-wave</b> (both halves rectified, period π):</p>"+E("V<sub>dc</sub> = (1/π)∫<sub>0</sub><sup>π</sup> V<sub>m</sub> sin θ dθ = (V<sub>m</sub>/π)(2) = 2V<sub>m</sub>/π = 0.636V<sub>m</sub>")+"<p><b>3. With silicon diodes:</b> replace V<sub>m</sub> by V<sub>m</sub> − V<sub>K</sub> (half-wave, centre-tap) or V<sub>m</sub> − 2V<sub>K</sub> (bridge).</p><p><b>4. Why PIV differs:</b> in a bridge each off diode sees about V<sub>m</sub>. In a centre-tap circuit the off diode sees the other half-winding (V<sub>m</sub>) plus the conducting half’s output (V<sub>m</sub>), so PIV = 2V<sub>m</sub>.</p>"},
{h:"Zener shunt regulator conditions (V<sub>i</sub> min, R<sub>L</sub> min)",b:"<p>Series resistor R<sub>s</sub>, Zener V<sub>Z</sub> in parallel with load R<sub>L</sub>.</p><p><b>1. Remove the Zener</b> and find the open-circuit voltage across R<sub>L</sub>:</p>"+E("V<sub>L</sub> = V<sub>i</sub>R<sub>L</sub>/(R<sub>L</sub> + R<sub>s</sub>)")+"<p><b>2. The Zener is ON</b> only if V<sub>L</sub> ≥ V<sub>Z</sub>:</p>"+E("V<sub>iMIN</sub> = V<sub>Z</sub>(R<sub>L</sub> + R<sub>s</sub>)/R<sub>L</sub>")+"<p><b>3. For fixed V<sub>i</sub></b>, set the boundary V<sub>L</sub> = V<sub>Z</sub> with I<sub>Z</sub> = 0, so I<sub>L</sub> = I<sub>R</sub> = (V<sub>i</sub> − V<sub>Z</sub>)/R<sub>s</sub>:</p>"+E("R<sub>LMIN</sub> = V<sub>Z</sub>/I<sub>LMAX</sub> = R<sub>s</sub>V<sub>Z</sub>/(V<sub>i</sub> − V<sub>Z</sub>)")+"<p><b>4. Zener current:</b> I<sub>Z</sub> = I<sub>R</sub> − I<sub>L</sub>, max when R<sub>L</sub> is open (I<sub>L</sub> = 0), where P<sub>Z</sub> = V<sub>Z</sub>I<sub>R</sub> must be ≤ P<sub>ZM</sub>.</p><p><b>Example:</b> V<sub>Z</sub> = 10 V, R<sub>s</sub> = 0.5 kΩ, R<sub>L</sub> = 1 kΩ ⇒ V<sub>iMIN</sub> = 10(1.5)/1 = 15 V.</p>"}];
CH[2].deriv=[
{h:"α, β relationships",b:"<p><b>Definitions:</b> α = I<sub>C</sub>/I<sub>E</sub>, β = I<sub>C</sub>/I<sub>B</sub>, and I<sub>E</sub> = I<sub>C</sub> + I<sub>B</sub>.</p><p><b>1. β in terms of α.</b> Substitute I<sub>E</sub> = I<sub>C</sub>/α:</p>"+E("I<sub>C</sub>/α = I<sub>C</sub> + I<sub>B</sub> ⇒ I<sub>C</sub>(1/α − 1) = I<sub>B</sub> ⇒ β = I<sub>C</sub>/I<sub>B</sub> = 1/(1/α − 1) = α/(1 − α)")+"<p><b>2. α in terms of β.</b> Divide I<sub>E</sub> = I<sub>C</sub> + I<sub>B</sub> by I<sub>B</sub>: I<sub>E</sub>/I<sub>B</sub> = β + 1.</p>"+E("α = I<sub>C</sub>/I<sub>E</sub> = βI<sub>B</sub>/[(β+1)I<sub>B</sub>] = β/(β + 1)")+"<p><b>Checks:</b> α = 0.98 → β = 49; β = 100 → α = 0.990.</p>"},
{h:"I<sub>C</sub> = βI<sub>B</sub> + (β+1)I<sub>CBO</sub> and I<sub>CEO</sub>",b:"<p>In the CB view the collector current has a leakage part: I<sub>C</sub> = αI<sub>E</sub> + I<sub>CBO</sub>.</p><p><b>1. Put I<sub>E</sub> = I<sub>C</sub> + I<sub>B</sub>:</b></p>"+E("I<sub>C</sub> = α(I<sub>C</sub> + I<sub>B</sub>) + I<sub>CBO</sub>")+"<p><b>2. Collect I<sub>C</sub>:</b></p>"+E("I<sub>C</sub>(1 − α) = αI<sub>B</sub> + I<sub>CBO</sub> ⇒ I<sub>C</sub> = [α/(1−α)]I<sub>B</sub> + I<sub>CBO</sub>/(1−α)")+"<p><b>3. Use β = α/(1−α) and 1/(1−α) = β + 1:</b></p>"+E("I<sub>C</sub> = βI<sub>B</sub> + (β+1)I<sub>CBO</sub>")+"<p><b>4. Cutoff in CE (I<sub>B</sub> = 0):</b></p>"+E("I<sub>CEO</sub> = I<sub>CBO</sub>/(1 − α) = (β+1)I<sub>CBO</sub> ≈ βI<sub>CBO</sub>")+"<p>This is why leakage is amplified in CE and why I<sub>C</sub> is never exactly 0 at I<sub>B</sub> = 0.</p>"}];
CH[3].deriv=[
{h:"Emitter bias: I<sub>B</sub>, I<sub>C</sub>, V<sub>CE</sub>",b:"<p><b>1. KVL, base–emitter loop</b> (V<sub>CC</sub> → R<sub>B</sub> → base → emitter → R<sub>E</sub> → ground):</p>"+E("V<sub>CC</sub> − I<sub>B</sub>R<sub>B</sub> − V<sub>BE</sub> − I<sub>E</sub>R<sub>E</sub> = 0")+"<p><b>2. Use I<sub>E</sub> = (β+1)I<sub>B</sub>:</b></p>"+E("I<sub>B</sub>[R<sub>B</sub> + (β+1)R<sub>E</sub>] = V<sub>CC</sub> − V<sub>BE</sub> ⇒ I<sub>B</sub> = (V<sub>CC</sub> − V<sub>BE</sub>)/(R<sub>B</sub> + (β+1)R<sub>E</sub>)")+"<p><b>3. Then</b> I<sub>C</sub> = βI<sub>B</sub>.</p><p><b>4. KVL, collector loop:</b> V<sub>CC</sub> − I<sub>C</sub>R<sub>C</sub> − V<sub>CE</sub> − I<sub>E</sub>R<sub>E</sub> = 0, with I<sub>E</sub> ≈ I<sub>C</sub>:</p>"+E("V<sub>CE</sub> = V<sub>CC</sub> − I<sub>C</sub>(R<sub>C</sub> + R<sub>E</sub>)")+"<p><b>Interpretation:</b> R<sub>E</sub> is “reflected” into the base loop multiplied by (β+1).</p>"},
{h:"Voltage-divider bias (exact Thevenin method)",b:"<p><b>1. Thevenin of the divider</b> seen from the base:</p>"+E("R<sub>Th</sub> = R<sub>1</sub>‖R<sub>2</sub>, E<sub>Th</sub> = V<sub>CC</sub>R<sub>2</sub>/(R<sub>1</sub> + R<sub>2</sub>)")+"<p><b>2. KVL on the input loop:</b></p>"+E("E<sub>Th</sub> − I<sub>B</sub>R<sub>Th</sub> − V<sub>BE</sub> − I<sub>E</sub>R<sub>E</sub> = 0, I<sub>E</sub> = (β+1)I<sub>B</sub>")+E("I<sub>B</sub> = (E<sub>Th</sub> − V<sub>BE</sub>)/(R<sub>Th</sub> + (β+1)R<sub>E</sub>)")+"<p><b>3. Approximate method.</b> If βR<sub>E</sub> ≥ 10R<sub>2</sub>, the base draws negligible divider current, so V<sub>B</sub> ≈ E<sub>Th</sub>, V<sub>E</sub> = V<sub>B</sub> − V<sub>BE</sub>, I<sub>E</sub> = V<sub>E</sub>/R<sub>E</sub> ≈ I<sub>C</sub> (no β needed).</p>"+E("V<sub>CE</sub> = V<sub>CC</sub> − I<sub>C</sub>(R<sub>C</sub> + R<sub>E</sub>)")},
{h:"Collector-feedback bias & stability factor of fixed bias",b:"<p><b>A. Collector feedback.</b> The current through R<sub>C</sub> is I′<sub>C</sub> = I<sub>C</sub> + I<sub>B</sub> ≈ I<sub>C</sub>. KVL through R<sub>C</sub>, R<sub>B</sub> and the emitter:</p>"+E("V<sub>CC</sub> − I<sub>C</sub>R<sub>C</sub> − I<sub>B</sub>R<sub>B</sub> − V<sub>BE</sub> − I<sub>E</sub>R<sub>E</sub> = 0")+"<p>Put I<sub>C</sub> ≈ I<sub>E</sub> = βI<sub>B</sub>:</p>"+E("I<sub>B</sub> = (V<sub>CC</sub> − V<sub>BE</sub>)/(R<sub>B</sub> + β(R<sub>C</sub> + R<sub>E</sub>))")+"<p>Stabilising action: if I<sub>C</sub> rises, V<sub>C</sub> falls, so I<sub>B</sub> falls, which pulls I<sub>C</sub> back.</p><p><b>B. Stability factor of fixed bias.</b> From I<sub>C</sub> = βI<sub>B</sub> + (β+1)I<sub>CO</sub> with I<sub>B</sub> = (V<sub>CC</sub>−V<sub>BE</sub>)/R<sub>B</sub> fixed:</p>"+E("S(I<sub>CO</sub>) = ΔI<sub>C</sub>/ΔI<sub>CO</sub> = β + 1")+"<p>A large S means poor stability. The divider with R<sub>Th</sub>/R<sub>E</sub> small gives S → 1.</p>"}];
CH[4].deriv=[
{h:"r<sub>e</sub> = 26 mV / I<sub>E</sub> and Z<sub>b</sub> = βr<sub>e</sub>",b:"<p><b>1. Transistor law</b> (active region): I<sub>E</sub> ≈ I<sub>s</sub>e<sup>V<sub>BE</sub>/V<sub>T</sub></sup>.</p><p><b>2. Differentiate:</b> dI<sub>E</sub>/dV<sub>BE</sub> = I<sub>E</sub>/V<sub>T</sub>, so the ac emitter resistance is</p>"+E("r<sub>e</sub> = dV<sub>BE</sub>/dI<sub>E</sub> = V<sub>T</sub>/I<sub>E</sub> = 26 mV/I<sub>E</sub>")+"<p><b>3. Input impedance at the base.</b> The ac input voltage appears across r<sub>e</sub> carrying I<sub>e</sub> = (β+1)I<sub>b</sub>:</p>"+E("V<sub>i</sub> = I<sub>e</sub>r<sub>e</sub> = (β+1)I<sub>b</sub>r<sub>e</sub> ≈ βI<sub>b</sub>r<sub>e</sub> ⇒ Z<sub>b</sub> = V<sub>i</sub>/I<sub>b</sub> ≈ βr<sub>e</sub>")+"<p>Example: I<sub>E</sub> = 2.6 mA → r<sub>e</sub> = 10 Ω; β = 100 → Z<sub>b</sub> = 1 kΩ.</p>"},
{h:"CE fixed-bias: Z<sub>i</sub>, Z<sub>o</sub>, A<sub>v</sub> = −R<sub>C</sub>/r<sub>e</sub>",b:"<p><b>ac model:</b> capacitors short, V<sub>CC</sub> = ground. R<sub>B</sub> in parallel with βr<sub>e</sub> at the input; current source βI<sub>b</sub> in parallel with r<sub>o</sub> and R<sub>C</sub> at the output.</p><p><b>1. Input:</b> Z<sub>i</sub> = R<sub>B</sub>‖βr<sub>e</sub> ≈ βr<sub>e</sub> if R<sub>B</sub> ≫ βr<sub>e</sub>.</p><p><b>2. Base current:</b> I<sub>b</sub> = V<sub>i</sub>/(βr<sub>e</sub>).</p><p><b>3. Output voltage</b> (current βI<sub>b</sub> flows through R<sub>C</sub>‖r<sub>o</sub>, directed so V<sub>o</sub> is negative):</p>"+E("V<sub>o</sub> = −βI<sub>b</sub>(R<sub>C</sub>‖r<sub>o</sub>) = −β[V<sub>i</sub>/(βr<sub>e</sub>)](R<sub>C</sub>‖r<sub>o</sub>)")+"<p><b>4. Gain:</b></p>"+E("A<sub>v</sub> = V<sub>o</sub>/V<sub>i</sub> = −(R<sub>C</sub>‖r<sub>o</sub>)/r<sub>e</sub> ≈ −R<sub>C</sub>/r<sub>e</sub>")+"<p><b>5. Output impedance:</b> set V<sub>i</sub> = 0 ⇒ I<sub>b</sub> = 0 ⇒ source dead: Z<sub>o</sub> = R<sub>C</sub>‖r<sub>o</sub> ≈ R<sub>C</sub>. The minus sign means a 180° phase shift.</p><p>Example: R<sub>C</sub> = 2.2 kΩ, r<sub>e</sub> = 10 Ω → A<sub>v</sub> ≈ −220.</p>"},
{h:"Unbypassed R<sub>E</sub>: Z<sub>b</sub> = β(r<sub>e</sub>+R<sub>E</sub>), A<sub>v</sub> = −R<sub>C</sub>/(r<sub>e</sub>+R<sub>E</sub>)",b:"<p><b>1. Input loop:</b> now both r<sub>e</sub> and R<sub>E</sub> carry I<sub>e</sub>:</p>"+E("V<sub>i</sub> ≈ I<sub>e</sub>(r<sub>e</sub> + R<sub>E</sub>) = (β+1)I<sub>b</sub>(r<sub>e</sub> + R<sub>E</sub>)")+E("Z<sub>b</sub> ≈ β(r<sub>e</sub> + R<sub>E</sub>)")+"<p><b>2. Output:</b> V<sub>o</sub> = −βI<sub>b</sub>R<sub>C</sub> with I<sub>b</sub> = V<sub>i</sub>/Z<sub>b</sub>:</p>"+E("A<sub>v</sub> = −βR<sub>C</sub>/[β(r<sub>e</sub>+R<sub>E</sub>)] = −R<sub>C</sub>/(r<sub>e</sub> + R<sub>E</sub>) ≈ −R<sub>C</sub>/R<sub>E</sub> (R<sub>E</sub> ≫ r<sub>e</sub>)")+"<p>Gain now depends on a resistor ratio, not on r<sub>e</sub> (which varies with I<sub>E</sub>). That’s the stability trade for lower gain. Bypassing R<sub>E</sub> restores A<sub>v</sub> = −R<sub>C</sub>/r<sub>e</sub>.</p>"},
{h:"Emitter follower: A<sub>v</sub> = R<sub>E</sub>/(R<sub>E</sub> + r<sub>e</sub>)",b:"<p>Output is taken at the emitter. The same emitter current flows through r<sub>e</sub> and R<sub>E</sub> in series:</p>"+E("V<sub>i</sub> = I<sub>e</sub>(r<sub>e</sub> + R<sub>E</sub>), V<sub>o</sub> = I<sub>e</sub>R<sub>E</sub>")+E("A<sub>v</sub> = V<sub>o</sub>/V<sub>i</sub> = R<sub>E</sub>/(R<sub>E</sub> + r<sub>e</sub>) ≈ 1 (in phase)")+"<p><b>Z<sub>b</sub> = β(r<sub>e</sub> + R<sub>E</sub>)</b> (high). <b>Z<sub>o</sub> ≈ r<sub>e</sub></b> (set V<sub>i</sub> = 0 and look back into the emitter). High Z<sub>i</sub>, low Z<sub>o</sub>, gain ≈ 1 makes it a buffer.</p>"}];
CH[5].deriv=[
{h:"Shockley equation points: I<sub>D</sub> = I<sub>DSS</sub>/4 at V<sub>P</sub>/2, and 0.3V<sub>P</sub> for I<sub>DSS</sub>/2",b:"<p><b>1. Start:</b> I<sub>D</sub> = I<sub>DSS</sub>(1 − V<sub>GS</sub>/V<sub>P</sub>)². Let x = V<sub>GS</sub>/V<sub>P</sub> (between 0 and 1 for an n-channel).</p><p><b>2. V<sub>GS</sub> = V<sub>P</sub>/2 (x = 0.5):</b></p>"+E("I<sub>D</sub> = I<sub>DSS</sub>(1 − 0.5)² = I<sub>DSS</sub>/4")+"<p><b>3. I<sub>D</sub> = I<sub>DSS</sub>/2:</b></p>"+E("(1 − x)² = 1/2 ⇒ 1 − x = 0.707 ⇒ x = 0.293 ≈ 0.3 ⇒ V<sub>GS</sub> ≈ 0.3V<sub>P</sub>")+"<p><b>4. Inverse form</b> (to get V<sub>GS</sub> from I<sub>D</sub>):</p>"+E("√(I<sub>D</sub>/I<sub>DSS</sub>) = 1 − V<sub>GS</sub>/V<sub>P</sub> ⇒ V<sub>GS</sub> = V<sub>P</sub>(1 − √(I<sub>D</sub>/I<sub>DSS</sub>))")+"<p><b>Plot points:</b> (0, I<sub>DSS</sub>), (0.3V<sub>P</sub>, I<sub>DSS</sub>/2), (V<sub>P</sub>/2, I<sub>DSS</sub>/4), (V<sub>P</sub>, 0). Example (I<sub>DSS</sub> = 8 mA, V<sub>P</sub> = −4 V): V<sub>GS</sub> = −2 V → 2 mA.</p>"},
{h:"E-MOSFET constant k and the square-law",b:"<p><b>Model:</b> I<sub>D</sub> = k(V<sub>GS</sub> − V<sub>T</sub>)², valid for V<sub>GS</sub> &gt; V<sub>T</sub> in saturation.</p><p><b>1. Use one datasheet point</b> (V<sub>GS(on)</sub>, I<sub>D(on)</sub>):</p>"+E("k = I<sub>D(on)</sub>/(V<sub>GS(on)</sub> − V<sub>T</sub>)²")+"<p><b>2. Example:</b> I<sub>D(on)</sub> = 6 mA at V<sub>GS(on)</sub> = 8 V, V<sub>T</sub> = 3 V:</p>"+E("k = 6 mA/(5 V)² = 0.24 mA/V²")+"<p><b>3. Predict I<sub>D</sub> at V<sub>GS</sub> = 5 V:</b> I<sub>D</sub> = 0.24(5 − 3)² = 0.96 mA.</p>"}];
CH[6].deriv=[
{h:"Self-bias: the bias line and Q-point (worked example)",b:"<p><b>1. Gate loop:</b> I<sub>G</sub> = 0, so V<sub>G</sub> = 0. The source voltage is V<sub>S</sub> = I<sub>D</sub>R<sub>S</sub>:</p>"+E("V<sub>GS</sub> = V<sub>G</sub> − V<sub>S</sub> = −I<sub>D</sub>R<sub>S</sub>")+"<p>This is a straight line through the origin (slope −1/R<sub>S</sub>) on the I<sub>D</sub>–V<sub>GS</sub> plane.</p><p><b>2. Solve algebraically</b> (I<sub>DSS</sub> = 8 mA, V<sub>P</sub> = −4 V, R<sub>S</sub> = 1 kΩ, I<sub>D</sub> in mA, V<sub>GS</sub> in V):</p>"+E("V<sub>GS</sub>/V<sub>P</sub> = (−I<sub>D</sub>)/(−4) = I<sub>D</sub>/4 ⇒ I<sub>D</sub> = 8(1 − I<sub>D</sub>/4)²")+E("I<sub>D</sub> = 8 − 4I<sub>D</sub> + I<sub>D</sub>²/2 ⇒ I<sub>D</sub>² − 10I<sub>D</sub> + 16 = 0 ⇒ I<sub>D</sub> = 2 or 8 mA")+"<p><b>3. Reject the root</b> that gives V<sub>GS</sub> = −8 V (&lt; V<sub>P</sub>, device off). So I<sub>D</sub> = 2 mA, V<sub>GS</sub> = −2 V.</p><p><b>4. Output loop:</b></p>"+E("V<sub>DS</sub> = V<sub>DD</sub> − I<sub>D</sub>(R<sub>D</sub> + R<sub>S</sub>), V<sub>S</sub> = I<sub>D</sub>R<sub>S</sub>, V<sub>D</sub> = V<sub>DD</sub> − I<sub>D</sub>R<sub>D</sub>")},
{h:"Voltage-divider bias: bias line and gate-loop KVL",b:"<p><b>1. Gate voltage</b> (I<sub>G</sub> = 0, divider unloaded):</p>"+E("V<sub>G</sub> = V<sub>DD</sub>R<sub>2</sub>/(R<sub>1</sub> + R<sub>2</sub>)")+"<p>Example: 16 V, R<sub>1</sub> = 2.1 MΩ, R<sub>2</sub> = 270 kΩ ⇒ V<sub>G</sub> = 1.82 V.</p><p><b>2. KVL on the gate-source loop:</b></p>"+E("V<sub>G</sub> − V<sub>GS</sub> − I<sub>D</sub>R<sub>S</sub> = 0 ⇒ V<sub>GS</sub> = V<sub>G</sub> − I<sub>D</sub>R<sub>S</sub>")+"<p><b>3. Two points define the bias line:</b> I<sub>D</sub> = 0 ⇒ V<sub>GS</sub> = V<sub>G</sub>; V<sub>GS</sub> = 0 ⇒ I<sub>D</sub> = V<sub>G</sub>/R<sub>S</sub>. Plot it with the transfer curve; the intersection is the Q-point.</p><p><b>4. Why it’s more stable:</b> a larger V<sub>G</sub> shifts the line away from the origin and makes it steeper in effect, so changes in I<sub>DSS</sub> and V<sub>P</sub> between devices move I<sub>D</sub> less.</p>"}];
CH.find(c=>c.n==9).deriv=[
{h:"Decibels and why 3 dB means half power",b:"<p><b>1. Definition (power):</b> G<sub>dB</sub> = 10 log<sub>10</sub>(P<sub>2</sub>/P<sub>1</sub>).</p><p><b>2. Voltage form.</b> For equal resistances P = V²/R:</p>"+E("G<sub>dB</sub> = 10 log(V<sub>2</sub>²/V<sub>1</sub>²) = 20 log(V<sub>2</sub>/V<sub>1</sub>)")+"<p><b>3. Half-power point:</b> P<sub>2</sub>/P<sub>1</sub> = 1/2 ⇒ 10 log 0.5 = −3.01 dB. Equivalent voltage ratio:</p>"+E("V<sub>2</sub>/V<sub>1</sub> = 1/√2 = 0.707 ⇒ 20 log 0.707 = −3 dB")+"<p><b>4. Cascading:</b> A<sub>v,T</sub> = A<sub>v1</sub>A<sub>v2</sub> ⇒ log turns the product into a sum, so dB gains add.</p>"},
{h:"Low-frequency cutoff of an RC coupling network",b:"<p>Series C with resistance R (R<sub>s</sub> + R<sub>i</sub> for input coupling).</p><p><b>1. Divider:</b> V<sub>o</sub>/V<sub>i</sub> = R/(R − jX<sub>C</sub>) with X<sub>C</sub> = 1/(2πfC).</p><p><b>2. Normalise:</b> divide numerator and denominator by R:</p>"+E("A<sub>v</sub>/A<sub>v(mid)</sub> = 1/(1 − j X<sub>C</sub>/R) = 1/(1 − j f<sub>1</sub>/f), f<sub>1</sub> = 1/(2πRC)")+"<p><b>3. Magnitude and phase:</b></p>"+E("|A| = 1/√(1 + (f<sub>1</sub>/f)²), θ = arctan(f<sub>1</sub>/f)")+"<p>At f = f<sub>1</sub>: |A| = 0.707 (−3 dB), θ = +45°. For f ≪ f<sub>1</sub>: |A| ≈ f/f<sub>1</sub> (+20 dB/decade). For f ≫ f<sub>1</sub>: |A| → 1.</p>"},
{h:"Miller effect: C<sub>Mi</sub> = (1 − A<sub>v</sub>)C<sub>f</sub>",b:"<p>A capacitor C<sub>f</sub> connects input (V<sub>i</sub>) and output (V<sub>o</sub> = A<sub>v</sub>V<sub>i</sub>).</p><p><b>1. Current through C<sub>f</sub> from the input:</b></p>"+E("I<sub>i</sub> = (V<sub>i</sub> − V<sub>o</sub>)/X<sub>Cf</sub> = (V<sub>i</sub> − A<sub>v</sub>V<sub>i</sub>)/X<sub>Cf</sub> = (1 − A<sub>v</sub>)V<sub>i</sub>/X<sub>Cf</sub>")+"<p><b>2. Equivalent input impedance</b> Z<sub>Mi</sub> = V<sub>i</sub>/I<sub>i</sub> = X<sub>Cf</sub>/(1 − A<sub>v</sub>), i.e. a capacitor</p>"+E("C<sub>Mi</sub> = (1 − A<sub>v</sub>)C<sub>f</sub>")+"<p><b>3. Output side:</b> similarly C<sub>Mo</sub> = (1 − 1/A<sub>v</sub>)C<sub>f</sub> ≈ C<sub>f</sub> for |A<sub>v</sub>| ≫ 1.</p><p>Example: A<sub>v</sub> = −100, C<sub>f</sub> = 5 pF ⇒ C<sub>Mi</sub> = 505 pF, which lowers f<sub>Hi</sub>.</p>"},
{h:"Bandwidth of n identical stages",b:"<p>One stage at high frequency: |A| = 1/√(1 + (f/f<sub>2</sub>)²). n stages: |A|<sup>n</sup>.</p><p><b>1. Find the new −3 dB frequency f<sub>2</sub>′:</b></p>"+E("[1/√(1 + (f<sub>2</sub>′/f<sub>2</sub>)²)]<sup>n</sup> = 1/√2")+"<p><b>2. Raise both sides to 2/n:</b></p>"+E("1/(1 + (f<sub>2</sub>′/f<sub>2</sub>)²) = 2<sup>−1/n</sup> ⇒ (f<sub>2</sub>′/f<sub>2</sub>)² = 2<sup>1/n</sup> − 1")+E("f<sub>2</sub>′ = f<sub>2</sub>√(2<sup>1/n</sup> − 1), and likewise f<sub>1</sub>′ = f<sub>1</sub>/√(2<sup>1/n</sup> − 1)")+"<p>n = 2: √(√2 − 1) = 0.644, so each added stage narrows the bandwidth.</p>"},
{h:"Rise time and bandwidth: t<sub>r</sub> ≈ 0.35 / BW",b:"<p>Model the amplifier as a single-pole low-pass with time constant τ = 1/(2πf<sub>2</sub>) driven by a step.</p><p><b>1. Step response:</b> v(t) = V(1 − e<sup>−t/τ</sup>).</p><p><b>2. 10% point:</b> 0.1 = 1 − e<sup>−t₁/τ</sup> ⇒ t<sub>1</sub> = 0.105τ. <b>90% point:</b> t<sub>2</sub> = 2.303τ.</p>"+E("t<sub>r</sub> = t<sub>2</sub> − t<sub>1</sub> = 2.2τ = 2.2/(2πf<sub>2</sub>) = 0.35/f<sub>2</sub>")+"<p>For a wideband amplifier BW ≈ f<sub>2</sub>, so BW ≈ 0.35/t<sub>r</sub>.</p>"}];
CH.find(c=>c.n==10).deriv=[
{h:"Inverting amplifier: A<sub>v</sub> = −R<sub>f</sub>/R<sub>1</sub>",b:"<p><b>Ideal op-amp rules:</b> (a) no current enters the inputs; (b) V⁻ = V⁺.</p><p><b>1.</b> V⁺ is grounded ⇒ V⁻ = 0 (virtual ground).</p><p><b>2. Current in R<sub>1</sub>:</b> I<sub>1</sub> = (V<sub>i</sub> − 0)/R<sub>1</sub>.</p><p><b>3. KCL at the inverting node</b> (no current into the op amp): all of I<sub>1</sub> flows through R<sub>f</sub>:</p>"+E("(0 − V<sub>o</sub>)/R<sub>f</sub> = V<sub>i</sub>/R<sub>1</sub>")+"<p><b>4.</b></p>"+E("A<sub>v</sub> = V<sub>o</sub>/V<sub>i</sub> = −R<sub>f</sub>/R<sub>1</sub>")+"<p>Input impedance ≈ R<sub>1</sub> (virtual ground). Example: R<sub>f</sub> = 100 kΩ, R<sub>1</sub> = 10 kΩ ⇒ −10.</p>"},
{h:"Non-inverting amplifier and the summer",b:"<p><b>A. Non-inverting.</b> V<sub>i</sub> at +, feedback divider R<sub>f</sub>/R<sub>1</sub> at −:</p>"+E("V⁻ = V<sub>o</sub>R<sub>1</sub>/(R<sub>1</sub> + R<sub>f</sub>) = V⁺ = V<sub>i</sub>")+E("A<sub>v</sub> = V<sub>o</sub>/V<sub>i</sub> = (R<sub>1</sub> + R<sub>f</sub>)/R<sub>1</sub> = 1 + R<sub>f</sub>/R<sub>1</sub>")+"<p>(R<sub>f</sub> = 0 gives the follower, A<sub>v</sub> = 1.)</p><p><b>B. Inverting summer.</b> Virtual ground, so I<sub>1</sub> = V<sub>1</sub>/R<sub>1</sub>, I<sub>2</sub> = V<sub>2</sub>/R<sub>2</sub>. KCL at the node: I<sub>1</sub> + I<sub>2</sub> = −V<sub>o</sub>/R<sub>f</sub>:</p>"+E("V<sub>o</sub> = −(R<sub>f</sub>/R<sub>1</sub>V<sub>1</sub> + R<sub>f</sub>/R<sub>2</sub>V<sub>2</sub>)")},
{h:"Integrator: V<sub>o</sub> = −(1/RC)∫V<sub>i</sub> dt",b:"<p>Input R, feedback capacitor C. Virtual ground at the − input.</p><p><b>1. Input current:</b> I = V<sub>i</sub>/R, and it all flows into C.</p><p><b>2. Capacitor law:</b> I = C dv<sub>C</sub>/dt, with v<sub>C</sub> = 0 − V<sub>o</sub> = −V<sub>o</sub>:</p>"+E("V<sub>i</sub>/R = −C dV<sub>o</sub>/dt")+"<p><b>3. Integrate:</b></p>"+E("V<sub>o</sub>(t) = −(1/RC)∫<sub>0</sub><sup>t</sup> V<sub>i</sub> dt + V<sub>o</sub>(0)")+"<p>Check: constant V<sub>i</sub> gives a ramp of slope −V<sub>i</sub>/RC. Swapping R and C gives the differentiator V<sub>o</sub> = −RC dV<sub>i</sub>/dt.</p>"},
{h:"Differential/common-mode output and CMRR",b:"<p><b>1. Decompose</b> the inputs: V<sub>1</sub> = V<sub>c</sub> + V<sub>d</sub>/2, V<sub>2</sub> = V<sub>c</sub> − V<sub>d</sub>/2, so</p>"+E("V<sub>d</sub> = V<sub>1</sub> − V<sub>2</sub>, V<sub>c</sub> = (V<sub>1</sub> + V<sub>2</sub>)/2")+"<p><b>2. Superposition</b> (linear amplifier):</p>"+E("V<sub>o</sub> = A<sub>d</sub>V<sub>d</sub> + A<sub>c</sub>V<sub>c</sub>")+"<p><b>3. Factor out A<sub>d</sub>V<sub>d</sub>:</b></p>"+E("V<sub>o</sub> = A<sub>d</sub>V<sub>d</sub>[1 + (1/CMRR)(V<sub>c</sub>/V<sub>d</sub>)], CMRR = A<sub>d</sub>/A<sub>c</sub>")+"<p>The second term is the error from common-mode signals; CMRR(dB) = 20 log(A<sub>d</sub>/A<sub>c</sub>). Example: A<sub>d</sub> = 1000, A<sub>c</sub> = 0.1 ⇒ 10⁴ = 80 dB.</p>"},
{h:"Slew rate and maximum undistorted frequency",b:"<p><b>1.</b> Sine output v<sub>o</sub> = V<sub>p</sub> sin(2πft). Its steepest slope (at the zero crossing):</p>"+E("dv<sub>o</sub>/dt|<sub>max</sub> = 2πfV<sub>p</sub>")+"<p><b>2.</b> No distortion requires this ≤ SR:</p>"+E("f<sub>max</sub> = SR/(2πV<sub>p</sub>)")+"<p>Example: 741, SR = 0.5 V/μs = 5×10⁵ V/s, V<sub>p</sub> = 10 V ⇒ f<sub>max</sub> = 5×10⁵/(2π·10) ≈ 8 kHz.</p>"}];

notes:[
{h:"Small-signal model",b:"<div class='eq'>g<sub>m</sub> = ΔI<sub>D</sub>/ΔV<sub>GS</sub>, g<sub>m0</sub> = 2I<sub>DSS</sub>/|V<sub>P</sub>|, g<sub>m</sub> = g<sub>m0</sub>(1 − V<sub>GS</sub>/V<sub>P</sub>) = g<sub>m0</sub>√(I<sub>D</sub>/I<sub>DSS</sub>)<br>E-MOSFET: g<sub>m</sub> = 2k(V<sub>GS</sub> − V<sub>T</sub>)</div><p>ac model: open gate, current source g<sub>m</sub>V<sub>gs</sub> in parallel with r<sub>d</sub>. r<sub>d</sub> is often ignored if r<sub>d</sub> ≥ 10R<sub>D</sub>.</p>"},
{h:"Configuration summary",b:"<div class='eq'>CS (RS bypassed/fixed): Z<sub>i</sub> = R<sub>G</sub> (or R<sub>1</sub>‖R<sub>2</sub>), Z<sub>o</sub> = R<sub>D</sub>, A<sub>v</sub> = −g<sub>m</sub>R<sub>D</sub><br>CS unbypassed R<sub>S</sub>: A<sub>v</sub> = −g<sub>m</sub>R<sub>D</sub>/(1 + g<sub>m</sub>R<sub>S</sub>)<br>Source follower: A<sub>v</sub> = g<sub>m</sub>R<sub>S</sub>/(1 + g<sub>m</sub>R<sub>S</sub>) &lt; 1, Z<sub>o</sub> = R<sub>S</sub>‖1/g<sub>m</sub><br>CG: Z<sub>i</sub> = R<sub>S</sub>‖1/g<sub>m</sub>, A<sub>v</sub> = g<sub>m</sub>R<sub>D</sub> (in phase)</div>"},
{h:"E-MOSFET amplifiers",b:"<ul><li>Drain-feedback: A<sub>v</sub> ≈ −g<sub>m</sub>(R<sub>F</sub>‖R<sub>D</sub>‖r<sub>d</sub>); R<sub>F</sub> lowers Z<sub>i</sub> through the Miller effect.</li><li>Divider: Z<sub>i</sub> = R<sub>1</sub>‖R<sub>2</sub>, A<sub>v</sub> = −g<sub>m</sub>(R<sub>D</sub>‖r<sub>d</sub>).</li></ul>"},
{h:"Loading, cascade, troubleshooting",b:"<ul><li>A<sub>vL</sub> = −g<sub>m</sub>(R<sub>D</sub>‖R<sub>L</sub>‖r<sub>d</sub>); cascade gains multiply, with Z<sub>i2</sub> loading stage 1.</li><li>Check dc first: V<sub>DS</sub> ≈ V<sub>DD</sub> → I<sub>D</sub> ≈ 0; no ac gain with good dc → open capacitor.</li></ul>"}],
deriv:[
{h:"Transconductance g<sub>m</sub> from the Shockley equation",b:"<p><b>1. Definition:</b> g<sub>m</sub> = dI<sub>D</sub>/dV<sub>GS</sub> at the Q-point.</p><p><b>2. Differentiate</b> I<sub>D</sub> = I<sub>DSS</sub>(1 − V<sub>GS</sub>/V<sub>P</sub>)² using the chain rule:</p>"+"<div class='eq'>g<sub>m</sub> = 2I<sub>DSS</sub>(1 − V<sub>GS</sub>/V<sub>P</sub>)·(−1/V<sub>P</sub>) = (−2I<sub>DSS</sub>/V<sub>P</sub>)(1 − V<sub>GS</sub>/V<sub>P</sub>)</div><p><b>3. V<sub>P</sub> is negative</b> (n-channel), so −1/V<sub>P</sub> = 1/|V<sub>P</sub>|:</p><div class='eq'>g<sub>m0</sub> = 2I<sub>DSS</sub>/|V<sub>P</sub>|, g<sub>m</sub> = g<sub>m0</sub>(1 − V<sub>GS</sub>/V<sub>P</sub>)</div><p><b>4. In terms of I<sub>D</sub>:</b> (1 − V<sub>GS</sub>/V<sub>P</sub>) = √(I<sub>D</sub>/I<sub>DSS</sub>), so g<sub>m</sub> = g<sub>m0</sub>√(I<sub>D</sub>/I<sub>DSS</sub>).</p><p><b>Example:</b> I<sub>DSS</sub> = 8 mA, V<sub>P</sub> = −4 V ⇒ g<sub>m0</sub> = 4 mS; at V<sub>GS</sub> = −2 V, g<sub>m</sub> = 2 mS.</p>"},
{h:"CS amplifier with unbypassed R<sub>S</sub>: A<sub>v</sub> = −g<sub>m</sub>R<sub>D</sub>/(1 + g<sub>m</sub>R<sub>S</sub>)",b:"<p>Ignore r<sub>d</sub>. The gate is at V<sub>i</sub>; the source sits at V<sub>s</sub> = I<sub>d</sub>R<sub>S</sub>.</p><p><b>1. Controlled source:</b> I<sub>d</sub> = g<sub>m</sub>V<sub>gs</sub> = g<sub>m</sub>(V<sub>i</sub> − I<sub>d</sub>R<sub>S</sub>).</p><p><b>2. Solve for I<sub>d</sub>:</b></p><div class='eq'>I<sub>d</sub>(1 + g<sub>m</sub>R<sub>S</sub>) = g<sub>m</sub>V<sub>i</sub> ⇒ I<sub>d</sub> = g<sub>m</sub>V<sub>i</sub>/(1 + g<sub>m</sub>R<sub>S</sub>)</div><p><b>3. Output</b> (current flows up through R<sub>D</sub>): V<sub>o</sub> = −I<sub>d</sub>R<sub>D</sub>:</p><div class='eq'>A<sub>v</sub> = −g<sub>m</sub>R<sub>D</sub>/(1 + g<sub>m</sub>R<sub>S</sub>)</div><p>If R<sub>S</sub> is bypassed, R<sub>S</sub> → 0 and A<sub>v</sub> = −g<sub>m</sub>R<sub>D</sub>. For g<sub>m</sub>R<sub>S</sub> ≫ 1, A<sub>v</sub> ≈ −R<sub>D</sub>/R<sub>S</sub>.</p>"},
{h:"Source follower: A<sub>v</sub> = g<sub>m</sub>R<sub>S</sub>/(1 + g<sub>m</sub>R<sub>S</sub>), Z<sub>o</sub> = R<sub>S</sub>‖1/g<sub>m</sub>",b:"<p>Output at the source: V<sub>o</sub> = I<sub>d</sub>R<sub>S</sub>, drain at ac ground.</p><p><b>1.</b> V<sub>gs</sub> = V<sub>i</sub> − V<sub>o</sub>, so I<sub>d</sub> = g<sub>m</sub>(V<sub>i</sub> − V<sub>o</sub>).</p><p><b>2.</b> V<sub>o</sub> = g<sub>m</sub>(V<sub>i</sub> − V<sub>o</sub>)R<sub>S</sub> ⇒ V<sub>o</sub>(1 + g<sub>m</sub>R<sub>S</sub>) = g<sub>m</sub>R<sub>S</sub>V<sub>i</sub>:</p><div class='eq'>A<sub>v</sub> = g<sub>m</sub>R<sub>S</sub>/(1 + g<sub>m</sub>R<sub>S</sub>) &lt; 1 (in phase)</div><p><b>3. Output impedance:</b> set V<sub>i</sub> = 0 and apply V<sub>x</sub> at the source. Then V<sub>gs</sub> = −V<sub>x</sub>, so the source draws I = V<sub>x</sub>/R<sub>S</sub> + g<sub>m</sub>V<sub>x</sub> ⇒ Z<sub>o</sub> = V<sub>x</sub>/I = R<sub>S</sub>‖(1/g<sub>m</sub>).</p><p>Example: g<sub>m</sub> = 2 mS, R<sub>S</sub> = 1 kΩ ⇒ A<sub>v</sub> = 0.67, Z<sub>o</sub> = 1 kΩ‖500 Ω = 333 Ω.</p>"}]});

notes:[
{h:"Basic circuits",b:"<div class='eq'>Inverting: −R<sub>f</sub>/R<sub>1</sub> · Non-inverting: 1+R<sub>f</sub>/R<sub>1</sub> · Summer: V<sub>o</sub> = −ΣR<sub>f</sub>/R<sub>n</sub>V<sub>n</sub> · Averager: R<sub>f</sub> = R/n<br>VCCS: I<sub>o</sub> = V<sub>i</sub>/R<sub>1</sub> · Follower: A<sub>v</sub> = 1</div>"},
{h:"Instrumentation amp",b:"<ul><li>Three op amps: two input buffers with gain set by R<sub>G</sub>, then a difference stage.</li><li>Gain (first stage) = 1 + 2R/R<sub>G</sub>. High Z<sub>i</sub>, high CMRR. Used with bridges, thermocouples, strain gauges.</li></ul>"},

deriv:[
{h:"Instrumentation amplifier first-stage gain",b:"<p>Op amps A1, A2 buffer V<sub>1</sub>, V<sub>2</sub> (at the + inputs). R<sub>G</sub> joins the two inverting inputs; each feedback resistor is R.</p><p><b>1. Virtual shorts:</b> the inverting inputs sit at V<sub>1</sub> and V<sub>2</sub>.</p><p><b>2. Current in R<sub>G</sub>:</b> I = (V<sub>1</sub> − V<sub>2</sub>)/R<sub>G</sub> (no current enters the op amps).</p><p><b>3. Same I flows through both R:</b></p>"+E("V<sub>o1</sub> − V<sub>o2</sub> = I(R + R<sub>G</sub> + R) = (V<sub>1</sub> − V<sub>2</sub>)(1 + 2R/R<sub>G</sub>)")+"<p>For a common-mode input V<sub>1</sub> = V<sub>2</sub>, I = 0, so the gain is 1. The difference stage then removes what remains of the common mode.</p>"},
{h:"First-order active low-pass filter",b:"<p>RC at the + input of a non-inverting amplifier with gain K = 1 + R<sub>f</sub>/R<sub>1</sub>.</p><p><b>1. RC divider:</b></p>"+E("V⁺ = V<sub>i</sub>·[1/(jωC)]/[R + 1/(jωC)] = V<sub>i</sub>/(1 + jωRC)")+"<p><b>2. Amplify:</b></p>"+E("V<sub>o</sub>/V<sub>i</sub> = K/(1 + j f/f<sub>c</sub>), f<sub>c</sub> = 1/(2πRC)")+"<p>|A| = K/√(1 + (f/f<sub>c</sub>)²). At f<sub>c</sub> the gain is K/√2 (−3 dB), and well above f<sub>c</sub> it falls at 20 dB/decade.</p>"}]});

{h:"Practical points",b:"<ul><li>Class B has crossover distortion; class AB bias cures it. Push-pull cancels even harmonics.</li><li>Heat sinks lower θ<sub>SA</sub>; avoid thermal runaway with emitter resistors or thermal tracking.</li></ul>"}],
deriv:[
{h:"Maximum efficiency of series-fed class A (25%)",b:"<p>Series-fed stage, load R<sub>C</sub>, Q-point at mid load line.</p><p><b>1. Q-point:</b> V<sub>CEQ</sub> = V<sub>CC</sub>/2, I<sub>CQ</sub> = V<sub>CC</sub>/(2R<sub>C</sub>).</p><p><b>2. Input power:</b></p>"+E("P<sub>i</sub> = V<sub>CC</sub>I<sub>CQ</sub> = V<sub>CC</sub>²/(2R<sub>C</sub>)")+"<p><b>3. Maximum swing</b> (limited by cutoff and saturation): V<sub>pp</sub> = V<sub>CC</sub>, I<sub>pp</sub> = V<sub>CC</sub>/R<sub>C</sub>:</p>"+E("P<sub>o</sub> = V<sub>pp</sub>I<sub>pp</sub>/8 = V<sub>CC</sub>²/(8R<sub>C</sub>)")+"<p><b>4. Efficiency:</b></p>"+E("η = P<sub>o</sub>/P<sub>i</sub> = [V<sub>CC</sub>²/8R<sub>C</sub>]/[V<sub>CC</sub>²/2R<sub>C</sub>] = 1/4 = 25%")},
{h:"Class B efficiency: η = (π/4)(V<sub>p</sub>/V<sub>CC</sub>), maximum 78.5%",b:"<p>Push-pull stage, load R<sub>L</sub>, output peak V<sub>p</sub>, supply V<sub>CC</sub>.</p><p><b>1. Output power:</b></p>"+E("P<sub>o</sub> = V<sub>p</sub>²/(2R<sub>L</sub>)")+"<p><b>2. Supply current:</b> each device passes a half-sine of peak I<sub>p</sub> = V<sub>p</sub>/R<sub>L</sub>; the supply sees the average of the rectified wave:</p>"+E("I<sub>dc</sub> = (1/π)∫<sub>0</sub><sup>π</sup> I<sub>p</sub> sin θ dθ = 2I<sub>p</sub>/π, P<sub>i</sub> = V<sub>CC</sub>·2V<sub>p</sub>/(πR<sub>L</sub>)")+"<p><b>3. Ratio:</b></p>"+E("η = (V<sub>p</sub>²/2R<sub>L</sub>)/(2V<sub>CC</sub>V<sub>p</sub>/πR<sub>L</sub>) = πV<sub>p</sub>/(4V<sub>CC</sub>)")+"<p>For V<sub>p</sub> = V<sub>CC</sub> (maximum): η = π/4 = 78.5%.</p>"},
{h:"Transformer impedance reflection",b:"<p>Ideal transformer, turns N<sub>1</sub> (primary), N<sub>2</sub> (secondary), load R<sub>L</sub> on the secondary.</p><p><b>1.</b> V<sub>1</sub>/V<sub>2</sub> = N<sub>1</sub>/N<sub>2</sub>, and (power conserved) I<sub>1</sub>/I<sub>2</sub> = N<sub>2</sub>/N<sub>1</sub>.</p><p><b>2. Impedance seen at the primary:</b></p>"+E("R′<sub>L</sub> = V<sub>1</sub>/I<sub>1</sub> = (N<sub>1</sub>/N<sub>2</sub>)(V<sub>2</sub>)/[(N<sub>2</sub>/N<sub>1</sub>)I<sub>2</sub>] = (N<sub>1</sub>/N<sub>2</sub>)²R<sub>L</sub>")+"<p>Example: N<sub>1</sub>/N<sub>2</sub> = 3, R<sub>L</sub> = 8 Ω ⇒ R′<sub>L</sub> = 72 Ω. This matches a low-resistance speaker to the transistor.</p>"}]});

{t:"555 timer IC unit operation (13.4)",q:[
