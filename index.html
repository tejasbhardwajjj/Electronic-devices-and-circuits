notes:[
{h:"Comparators & DACs",b:"<ul><li>Comparator: open-loop, output saturates high/low; Schmitt trigger uses positive feedback for hysteresis (UTP/LTP).</li><li>DAC: n bits → 2<sup>n</sup> levels; binary-weighted or R-2R ladder with a summing op amp.</li></ul>"},
{h:"555 timer",b:"<div class='eq'>Thresholds: 2V<sub>CC</sub>/3, V<sub>CC</sub>/3<br>Astable: f = 1.44/[(R<sub>A</sub>+2R<sub>B</sub>)C], t<sub>H</sub> = 0.693(R<sub>A</sub>+R<sub>B</sub>)C, t<sub>L</sub> = 0.693R<sub>B</sub>C<br>Monostable: T = 1.1RC</div>"},
{h:"VCO, PLL, interfacing",b:"<ul><li>VCO: f set by V<sub>C</sub>; 566 gives square/triangle waves.</li><li>PLL = phase detector + low-pass filter + VCO; modes: free-running, capture, lock. Used for FM demodulation, synthesis, tone decoding.</li><li>Interfacing: line drivers/receivers, opto-isolators, level shifters, open-collector with pull-ups.</li></ul>"}],
deriv:[
{h:"555 astable: f = 1.44 / [(R<sub>A</sub> + 2R<sub>B</sub>)C]",b:"<p>The capacitor swings between V<sub>CC</sub>/3 and 2V<sub>CC</sub>/3.</p><p><b>1. Charging</b> through R<sub>A</sub> + R<sub>B</sub> from V<sub>CC</sub>/3 toward V<sub>CC</sub>: v = V<sub>CC</sub> − (2V<sub>CC</sub>/3)e<sup>−t/τ</sup>. It reaches 2V<sub>CC</sub>/3 when e<sup>−t/τ</sup> = 1/2:</p>"+E("t<sub>H</sub> = (R<sub>A</sub>+R<sub>B</sub>)C ln 2 = 0.693(R<sub>A</sub>+R<sub>B</sub>)C")+"<p><b>2. Discharging</b> through R<sub>B</sub> from 2V<sub>CC</sub>/3 to V<sub>CC</sub>/3 (halves):</p>"+E("t<sub>L</sub> = 0.693R<sub>B</sub>C")+"<p><b>3. Period and frequency:</b></p>"+E("T = 0.693(R<sub>A</sub> + 2R<sub>B</sub>)C ⇒ f = 1/T = 1.44/[(R<sub>A</sub> + 2R<sub>B</sub>)C]")+"<p>Duty cycle = t<sub>H</sub>/T = (R<sub>A</sub>+R<sub>B</sub>)/(R<sub>A</sub>+2R<sub>B</sub>) &gt; 50%.</p>"},
{h:"555 monostable pulse width: T = 1.1RC",b:"<p>After the trigger, the capacitor charges from 0 through R toward V<sub>CC</sub> until it reaches the 2V<sub>CC</sub>/3 threshold.</p><p><b>1.</b> v(t) = V<sub>CC</sub>(1 − e<sup>−t/RC</sup>).</p><p><b>2. Set v = 2V<sub>CC</sub>/3:</b></p>"+E("1 − e<sup>−T/RC</sup> = 2/3 ⇒ e<sup>−T/RC</sup> = 1/3 ⇒ T = RC ln 3 ≈ 1.1RC")+"<p>Example: R = 10 kΩ, C = 10 μF ⇒ T = 0.11 s. T is independent of V<sub>CC</sub>.</p>"},
{h:"R-2R / binary-weighted DAC output",b:"<p>Binary-weighted summer with feedback R<sub>f</sub>, input resistors R, 2R, 4R, 8R for bits b<sub>3</sub>…b<sub>0</sub> (each bit = 0 or V<sub>ref</sub>).</p><p><b>1. Summing amplifier law:</b></p>"+E("V<sub>o</sub> = −R<sub>f</sub>(b<sub>3</sub>V<sub>ref</sub>/R + b<sub>2</sub>V<sub>ref</sub>/2R + b<sub>1</sub>V<sub>ref</sub>/4R + b<sub>0</sub>V<sub>ref</sub>/8R)")+"<p><b>2. Factor:</b></p>"+E("V<sub>o</sub> = −(R<sub>f</sub>V<sub>ref</sub>/8R)(8b<sub>3</sub> + 4b<sub>2</sub> + 2b<sub>1</sub> + b<sub>0</sub>) = −(R<sub>f</sub>V<sub>ref</sub>/8R)·D")+"<p>The output is proportional to the decimal code D. The step (1 LSB) is R<sub>f</sub>V<sub>ref</sub>/8R.</p>"}]});

],
notes:[
{h:"Feedback fundamentals",b:"<div class='eq'>A<sub>f</sub> = A/(1 + βA), D = 1 + βA<br>βA ≫ 1 ⇒ A<sub>f</sub> ≈ 1/β</div><ul><li>Negative feedback lowers gain but stabilises it, cuts distortion/noise, widens bandwidth.</li><li>Types: voltage-series (Z<sub>i</sub>↑ Z<sub>o</sub>↓), current-series (↑↑), voltage-shunt (↓↓), current-shunt (↓↑).</li></ul>"},
{h:"Stability",b:"<ul><li>Unstable when βA = −1 (unity loop gain at 180°). Gain margin = −20log|βA| at 180°; phase margin = 180° − phase at |βA| = 1 (≥ 45° preferred).</li><li>Fix by dominant-pole compensation.</li></ul>"},
{h:"Oscillators",b:"<div class='eq'>Barkhausen: |βA| = 1, ∠βA = 0°<br>Phase-shift: f = 1/(2πRC√6), A ≥ 29 · Wien: f = 1/(2πRC), A ≥ 3<br>LC: f = 1/(2π√(LC)); Colpitts C<sub>eq</sub> = C<sub>1</sub>C<sub>2</sub>/(C<sub>1</sub>+C<sub>2</sub>); Hartley L<sub>eq</sub> = L<sub>1</sub>+L<sub>2</sub>(+2M)<br>Crystal: f<sub>s</sub> (series), f<sub>p</sub> slightly higher · UJT: relaxation, f ≈ 1/[RC ln(1/(1−η))]</div>"}],
deriv:[
{h:"Closed-loop gain A<sub>f</sub> = A / (1 + βA) and its benefits",b:"<p>Source X<sub>s</sub>, amplifier A, feedback network β, subtracting at the input.</p><p><b>1. Equations:</b> X<sub>i</sub> = X<sub>s</sub> − X<sub>f</sub>, X<sub>f</sub> = βX<sub>o</sub>, X<sub>o</sub> = AX<sub>i</sub>.</p><p><b>2. Substitute:</b></p>"+E("X<sub>o</sub> = A(X<sub>s</sub> − βX<sub>o</sub>) ⇒ X<sub>o</sub>(1 + βA) = AX<sub>s</sub>")+E("A<sub>f</sub> = X<sub>o</sub>/X<sub>s</sub> = A/(1 + βA)")+"<p><b>3. Gain sensitivity:</b> differentiate with respect to A:</p>"+E("dA<sub>f</sub>/A<sub>f</sub> = (1/(1 + βA))·(dA/A)")+"<p>A 10% change in A gives only 10%/(1 + βA) change in A<sub>f</sub>. Distortion and noise generated inside the loop are also reduced by (1 + βA).</p>"},
{h:"Wien bridge oscillator: f = 1/(2πRC), gain = 3",b:"<p>Feedback network: series R–C (Z<sub>1</sub>) feeding a parallel R‖C (Z<sub>2</sub>) to ground.</p><p><b>1. Impedances:</b> Z<sub>1</sub> = R + 1/(jωC), Z<sub>2</sub> = R/(1 + jωRC).</p><p><b>2. Feedback factor:</b></p>"+E("β = Z<sub>2</sub>/(Z<sub>1</sub> + Z<sub>2</sub>) = 1/[3 + j(ωRC − 1/ωRC)]")+"<p><b>3. Zero phase</b> requires the imaginary part to vanish: ωRC = 1/(ωRC) ⇒</p>"+E("ω<sub>0</sub> = 1/RC ⇒ f<sub>0</sub> = 1/(2πRC)")+"<p><b>4. At f<sub>0</sub>:</b> β = 1/3, so Barkhausen (βA = 1) needs a non-inverting amplifier gain A = 3 (R<sub>f</sub> = 2R<sub>1</sub>).</p>"},
{h:"Colpitts oscillator frequency",b:"<p>Tank: inductor L with two series capacitors C<sub>1</sub>, C<sub>2</sub>. The feedback is taken from the capacitor midpoint.</p><p><b>1. Equivalent capacitance:</b></p>"+E("C<sub>eq</sub> = C<sub>1</sub>C<sub>2</sub>/(C<sub>1</sub> + C<sub>2</sub>)")+"<p><b>2. Resonance</b> (X<sub>L</sub> = X<sub>C</sub>):</p>"+E("f<sub>0</sub> = 1/(2π√(L·C<sub>eq</sub>))")+"<p><b>3. Feedback ratio</b> β = C<sub>1</sub>/C<sub>2</sub> (capacitive divider), so the amplifier needs gain A ≥ C<sub>2</sub>/C<sub>1</sub> to satisfy βA ≥ 1.</p><p>Example: L = 1 mH, C<sub>1</sub> = C<sub>2</sub> = 2 μF ⇒ C<sub>eq</sub> = 1 μF ⇒ f<sub>0</sub> = 5.03 kHz.</p>"}]});
// ===== ENGINE =====
CH.sort((a,b)=>a.n-b.n);
function shuf(q){const c=q[1][q[2]],o=q[1].map(x=>x);for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return [q[0],o,o.indexOf(c),q[3]]}
CH.forEach(c=>c.topics.forEach(t=>{t.q=t.q.map(shuf)}));
let P={};try{P=JSON.parse(localStorage.getItem('edct')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('edct',JSON.stringify(P))}catch(e){}};
let S={c:0,tab:'q',quiz:null};
const $=id=>document.getElementById(id);
function nav(){$('nav').innerHTML=CH.map((c,i)=>`<button class="ch ${i==S.c?'on':''}" onclick="S.c=${i};S.quiz=null;draw()">Ch ${c.n} · ${c.title}</button>`).join('')+`<p class="mut">Chapters 1–14 complete.</p>`}
function draw(){nav();const c=CH[S.c];
 let h=`<div class="tabs"><button class="${S.tab=='q'?'on':''}" onclick="S.tab='q';S.quiz=null;draw()">Questions</button><button class="${S.tab=='n'?'on':''}" onclick="S.tab='n';draw()">Short notes</button><button class="${S.tab=='d'?'on':''}" onclick="S.tab='d';draw()">Derivations</button></div>`;
 if(S.tab=='q')h+=S.quiz?quizView():c.topics.map((t,i)=>{const k=`c${c.n}t${i}`,b=P[k]||0;return `<div class="card"><h3>${t.t}</h3><span class="mut">${t.q.length} questions · best ${b}%</span><div class="bar"><i style="width:${b}%"></i></div><p><button class="pri" onclick="start(${i})">Start</button></p></div>`}).join('');
 if(S.tab=='n')h+=c.notes.map(n=>`<div class="card"><h3>${n.h}</h3>${n.b}</div>`).join('');
 if(S.tab=='d')h+=c.deriv.map(n=>`<div class="card"><h3>${n.h}</h3>${n.b}</div>`).join('');
 $('main').innerHTML=h}
function start(ti,only){const t=CH[S.c].topics[ti];S.quiz={ti,list:(only||t.q.map((_,i)=>i)),pos:0,pick:null,wrong:[],score:0};draw()}
function quizView(){const Q=S.quiz,t=CH[S.c].topics[Q.ti];
 if(Q.pos>=Q.list.length){const pct=Math.round(100*Q.score/Q.list.length),k=`c${CH[S.c].n}t${Q.ti}`;
  if(!Q.only&&Q.list.length==t.q.length&&pct>(P[k]||0)){P[k]=pct;save()}
  return `<div class="card"><h3>Score: ${Q.score}/${Q.list.length} (${pct}%)</h3>${Q.wrong.length?'<h4>Review: what you missed</h4>'+Q.wrong.map(i=>{const w=t.q[i];return `<div class="exp"><b>${w[0]}</b><br><span style="color:var(--ok)">✔ ${String.fromCharCode(65+w[2])}. ${w[1][w[2]]}</span><br>${w[3]}</div>`}).join('')+'<p></p>':'<p>Perfect!</p>'}${Q.wrong.length?`<button class="pri" onclick="S.quiz.only=1;start(${Q.ti},[${Q.wrong}]);S.quiz.only=1">Retry wrong (${Q.wrong.length})</button> `:''}<button onclick="S.quiz=null;draw()">Back to topics</button></div>`}
 const i=Q.list[Q.pos],q=t.q[i];
 return `<div class="card"><span class="mut">${t.t} · Q${Q.pos+1}/${Q.list.length}</span><div class="bar"><i style="width:${100*Q.pos/Q.list.length}%"></i></div><h3 style="margin-top:14px">${q[0]}</h3>`+
 q[1].map((o,j)=>{let cl='';if(Q.pick!==null){if(j==q[2])cl='ok';else if(j==Q.pick)cl='bad'}return `<button class="opt ${cl}" ${Q.pick!==null?'disabled':''} onclick="ans(${j})">${String.fromCharCode(65+j)}. ${o}</button>`}).join('')+
 (Q.pick!==null?(Q.pick!=q[2]?`<div class="exp" style="border-color:var(--ok);color:var(--tx)"><b style="color:var(--ok)">✔ Correct answer: ${String.fromCharCode(65+q[2])}. ${q[1][q[2]]}</b></div>`:'')+`<div class="exp">${q[3]}</div><p><button class="pri" onclick="S.quiz.pos++;S.quiz.pick=null;draw()">Next →</button></p>`:'')+`</div>`}
function ans(j){const Q=S.quiz,i=Q.list[Q.pos],q=CH[S.c].topics[Q.ti].q[i];Q.pick=j;if(j==q[2])Q.score++;else Q.wrong.push(i);draw()}
$('th').onclick=()=>{const d=document.documentElement;d.dataset.t=d.dataset.t=='light'?'dark':'light'};
draw();
</script></body></html>
